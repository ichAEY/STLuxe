name: Install STLuxe clean mobile v11
on:
  push:
    paths:
      - '.github/workflows/install-clean-v11.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch mobile layer to v11
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script defer src="mobile-stluxe-clean-v10.js?v=20260829-0315"></script>'
          new='<script defer src="mobile-stluxe-clean-v11.js?v=20260829-0355"></script>'
          if old not in s:
              raise SystemExit('Expected v10 script tag not found; refusing to modify index.html')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Syntax check v11
        run: node --check mobile-stluxe-clean-v11.js
      - name: Commit switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable STLuxe clean mobile v11'
          git push
