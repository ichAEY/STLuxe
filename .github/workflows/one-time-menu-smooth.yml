name: One-time STLuxe smooth menu patch

on:
  push:
    paths:
      - '.github/workflows/one-time-menu-smooth.yml'

permissions:
  contents: write

jobs:
  patch-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine top section menu
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('mobile-stluxe-final-v22.js')
          s = js.read_text()

          old_css = ".tn23-section-nav{position:fixed;z-index:70;top:0;left:0;right:0;width:100%;height:48px;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.98);border-bottom:1px solid #e7e4e1;box-shadow:0 3px 12px rgba(30,25,22,.035);transform:translateY(-110%);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.22,.78,.25,1),opacity .2s ease;will-change:transform,opacity}.tn23-section-nav.visible{transform:translateY(0);opacity:1;pointer-events:auto}.tn23-section-nav::-webkit-scrollbar{display:none}.tn23-section-nav button{position:relative;flex:0 0 auto;min-width:92px;padding:0 14px;border:0;background:transparent;color:#8a8886;font:500 12px/1 'Manrope',Arial,sans-serif;white-space:nowrap}.tn23-section-nav button.active{color:#151412}.tn23-section-nav button.active:after{content:'';position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#111}"
          new_css = ".tn23-section-nav{position:fixed;z-index:70;top:0;left:0;right:0;width:100%;height:48px;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.98);border-bottom:1px solid #e7e4e1;box-shadow:0 3px 12px rgba(30,25,22,.035);transform:translateY(-110%);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.22,.78,.25,1),opacity .2s ease;will-change:transform,opacity;scroll-behavior:smooth}.tn23-section-nav.visible{transform:translateY(0);opacity:1;pointer-events:auto}.tn23-section-nav::-webkit-scrollbar{display:none}.tn23-section-nav button{position:relative;flex:0 0 auto;min-width:82px;padding:0 11px;border:0;background:transparent;color:#5f5d5a;font:500 10.5px/1 'Manrope',Arial,sans-serif;white-space:nowrap}.tn23-section-nav button.active{color:#4b4946}.tn23-section-nav button.active:after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;border-radius:1px;background:#8d8984}"
          if old_css not in s:
              raise SystemExit('Expected section nav CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_fn = "function setActiveSection(id){if(!id)return;activeSection=id;const btn=sectionNav.querySelector(`[data-section=\"${id}\"]`);if(!btn)return;sectionNav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));btn.scrollIntoView({behavior:'auto',inline:'center',block:'nearest'})}"
          new_fn = "function revealActiveNavButton(btn){const navRect=sectionNav.getBoundingClientRect(),btnRect=btn.getBoundingClientRect(),pad=10;let delta=0;if(btnRect.right>navRect.right-pad)delta=btnRect.right-(navRect.right-pad);else if(btnRect.left<navRect.left+pad)delta=btnRect.left-(navRect.left+pad);if(Math.abs(delta)>1)sectionNav.scrollBy({left:delta,behavior:'smooth'})}\nfunction setActiveSection(id){if(!id)return;activeSection=id;const btn=sectionNav.querySelector(`[data-section=\"${id}\"]`);if(!btn)return;sectionNav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));revealActiveNavButton(btn)}"
          if old_fn not in s:
              raise SystemExit('Expected setActiveSection function not found')
          s = s.replace(old_fn, new_fn, 1)
          js.write_text(s)

          index = Path('index.html')
          h = index.read_text()
          old_ver = 'mobile-stluxe-final-v22.js?v=20260830-v24-navfix'
          new_ver = 'mobile-stluxe-final-v22.js?v=20260830-v25-smoothnav'
          if old_ver not in h:
              raise SystemExit('Expected script cache key not found')
          index.write_text(h.replace(old_ver, new_ver, 1))
          PY
      - name: Commit refined menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Refine mobile top menu scrolling"
          git push