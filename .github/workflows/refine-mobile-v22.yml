name: Refine STLuxe mobile v22
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine v22 styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-final-v22.js')
          s=p.read_text()
          reps={
            "background:#111;color:#fff;font:500 14px/1":"background:#111;color:#fff!important;font:500 14px/1",
            ".tn22-gallery-tab.active{background:#171513;color:#fff}":".tn22-gallery-tab.active{background:#171513;color:#fff!important}",
            ".tn22-master-tabs button.active{background:#171513;color:#fff}":".tn22-master-tabs button.active{background:#171513;color:#fff!important}",
            "background:#171513;color:#fff;font:600 13px/1":"background:#171513;color:#fff!important;font:600 13px/1",
            "font:400 12.5px/1.48 'Manrope'":"font:400 13px/1.48 'Manrope'"
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit(f'marker missing: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          i=Path('index.html')
          h=i.read_text()
          old='mobile-stluxe-final-v22.js?v=20260829-v22a'
          new='mobile-stluxe-final-v22.js?v=20260829-v22b'
          if new not in h:
              if old not in h: raise SystemExit('v22 cache marker missing')
              i.write_text(h.replace(old,new,1))
          PY
          node --check mobile-stluxe-final-v22.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Refine STLuxe mobile v22 visuals"
          git push
