name: One-time STLuxe v45 theme

on:
  push:
    paths:
      - '.github/workflows/one-time-v45-theme.yml'

permissions:
  contents: write

jobs:
  switch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch reversible theme layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script defer src="mobile-stluxe-theme-v44.js?v=20260831-v44-salon-theme"></script>'
          new='<script defer src="mobile-stluxe-theme-v45.js?v=20260831-v45-textured-neutral"></script>'
          if old not in s:
              raise SystemExit('v44 theme script marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: |
          node --check mobile-stluxe-theme-v45.js
          grep -q 'mobile-stluxe-theme-v45.js?v=20260831-v45-textured-neutral' index.html
      - name: Commit switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Switch STLuxe to textured neutral theme v45"
          git push
