name: Patch STLuxe mobile UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotfix-mobile-conflict.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested mobile UI changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('mobile-salon-tahmina-v1.js')
          s = p.read_text(encoding='utf-8')

          # Compact Fresha-like hero typography and spacing.
          s = re.sub(r'\.tm-hero\{[^}]+\}', '.tm-hero{position:relative;z-index:4;margin:-38px 0 0;background:#fbf8f4;padding:24px 20px calc(88px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;box-shadow:0 12px 32px rgba(75,55,39,.06);min-height:calc(100svh - 52px - clamp(292px,75vw,390px) + 38px);display:flex;flex-direction:column}', s, count=1)
          s = re.sub(r'\.tm-hero h1\{[^}]+\}', '.tm-hero h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:37px;line-height:1.02;letter-spacing:-.055em;margin:0 0 5px;color:#171513}', s, count=1)
          s = re.sub(r'\.tm-sub\{[^}]+\}', '.tm-sub{font-size:16px;line-height:1.35;color:#746d67;font-weight:400;margin:0 0 13px}', s, count=1)
          s = re.sub(r'\.tm-rating\{[^}]+\}', '.tm-rating{display:flex;align-items:center;gap:8px;background:transparent;border:0;border-radius:0;padding:0;font-size:14px;margin:0 0 13px}', s, count=1)
          s = re.sub(r'\.tm-meta\{[^}]+\}', '.tm-meta{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#746d67;line-height:1.4;margin-bottom:10px}', s, count=1)
          s = re.sub(r'\.tm-location\{[^}]+\}', '.tm-location{display:flex;align-items:flex-start;gap:10px;background:#efefed;border-radius:16px;padding:13px 14px;margin:2px 0 0;font-size:12px;line-height:1.45;color:#171513;font-weight:500}', s, count=1)

          # Fix service cards: copy left, reserve pill right, no overlap.
          s = re.sub(r'\.tm-service\{[^}]+\}', '.tm-service{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:14px;row-gap:8px;align-items:center;min-height:100px;padding:17px;border:1px solid #eee4dc;border-radius:20px;background:#fff;box-shadow:0 8px 26px rgba(91,68,48,.035)}', s, count=1)
          s = re.sub(r'\.tm-service-name\{[^}]+\}', '.tm-service-name{grid-column:1;grid-row:1;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:19px;line-height:1.18;font-weight:400;color:#2a201a;min-width:0}', s, count=1)
          s = re.sub(r'\.tm-service-price\{[^}]+\}', '.tm-service-price{grid-column:1;grid-row:2;font-size:13px;color:#6f665f;margin-top:0}', s, count=1)
          s = re.sub(r'\.tm-book-small\{[^}]+\}', '.tm-book-small{grid-column:2;grid-row:1/3;align-self:center;position:static;transform:none;height:38px;border:0;border-radius:999px;background:#44413f!important;color:#fff!important;padding:0 14px;font-size:11px;font-weight:500;white-space:nowrap}', s, count=1)

          # Larger review cards.
          s = re.sub(r'\.tm-review\{[^}]+\}', '.tm-review{min-width:92%;min-height:190px;scroll-snap-align:start;background:#fff;border:1px solid #eee5dc;border-radius:23px;padding:21px}', s, count=1)
          s = re.sub(r'\.tm-review p\{[^}]+\}', '.tm-review p{margin:0;font-size:15px;line-height:1.58;color:#514b46}', s, count=1)

          # Add hero jump link, fixed booking bar and team cue styles.
          marker = '    .tm-secondary{'
          if '.tm-bookbar-fixed{' not in s:
              css_lines = [
                '.tm-service-jump{width:100%;border:0;background:transparent;padding:18px 0 4px;margin-top:auto;font-size:13px;color:#504943;text-align:center;letter-spacing:-.01em}',
                '.tm-service-jump span{display:inline-block;margin-left:5px;font-size:15px}',
                '.tm-bookbar-fixed{position:fixed;left:0;right:0;bottom:0;z-index:150;min-height:76px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(251,248,244,.97);backdrop-filter:blur(18px) saturate(145%);border-top:1px solid rgba(220,211,202,.8);display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 -8px 28px rgba(45,34,25,.06)}',
                '.tm-bookbar-copy{display:flex;align-items:baseline;gap:5px;min-width:0;color:#6f6862}.tm-bookbar-copy strong{font-size:16px;color:#27231f;font-weight:650}.tm-bookbar-copy span{font-size:12px;white-space:nowrap}',
                '.tm-bookbar-button{height:48px;border:0;border-radius:999px;background:#3d3b39!important;color:#fff!important;padding:0 23px;font-size:15px;font-weight:600;white-space:nowrap}',
                '.tm-team-more{margin-top:22px;font-size:12px;color:#5f5750;text-align:center}.tm-team-more span{margin-left:5px}',
              ]
              css_block = ''.join('    '+line+'\\\n' for line in css_lines)
              s = s.replace(marker, css_block + marker, 1)

          # Replace hero booking button with a subtle services jump.
          old_hero_btn = '        <button class="tm-primary" id="tmHeroBook" type="button">Записаться</button>\\\n'
          new_hero_btn = '        <button class="tm-service-jump" id="tmToServices" type="button">Перейти к услугам <span>↓</span></button>\\\n'
          s = s.replace(old_hero_btn, new_hero_btn, 1)

          # Dynamic-hours placeholder only on hero.
          s = s.replace('<span id="tmHoursText">Вт–Вс 10:00–20:00</span>', '<span id="tmHoursText">Проверяем часы работы…</span>', 1)

          # Team cue.
          team_anchor = '        </div>\\\n      </section>\\\n\\\n      <section class="tm-section white" id="tmReviews">'
          if 'tm-team-more' not in s.split('root.innerHTML=',1)[-1]:
              s = s.replace(team_anchor, '        </div>\\\n        <div class="tm-team-more">Посмотреть всю команду <span>→</span></div>\\\n      </section>\\\n\\\n      <section class="tm-section white" id="tmReviews">', 1)

          # Fixed booking bar inserted after main.
          main_anchor = '    </main>\\\n    <footer class="tm-footer">'
          if 'id="tmBottomBook"' not in s:
              fixed_bar = '    </main>\\\n    <div class="tm-bookbar-fixed" aria-label="Быстрая запись"><div class="tm-bookbar-copy"><strong>70+</strong><span>услуг доступно</span></div><button class="tm-bookbar-button" id="tmBottomBook" type="button">Записаться</button></div>\\\n    <footer class="tm-footer">'
              s = s.replace(main_anchor, fixed_bar, 1)

          # Duplicate visible review cards to create a seamless loop.
          old_strip = "  strip.innerHTML=reviews.slice(0,5).map(function(r){return '<article class=\"tm-review\"><div class=\"tm-review-top\"><div class=\"tm-review-avatar\">'+initials(r[0])+'</div><div><div class=\"tm-review-name\">'+r[0]+'</div><div class=\"tm-review-source\">Яндекс Карты</div></div></div><p>'+r[1]+'</p></article>'}).join('');"
          new_strip = "  var loopReviews=reviews.slice(0,5);\n  strip.innerHTML=loopReviews.concat(loopReviews).map(function(r){return '<article class=\"tm-review\"><div class=\"tm-review-top\"><div class=\"tm-review-avatar\">'+initials(r[0])+'</div><div><div class=\"tm-review-name\">'+r[0]+'</div><div class=\"tm-review-source\">Яндекс Карты</div></div></div><p>'+r[1]+'</p></article>'}).join('');"
          s = s.replace(old_strip, new_strip, 1)

          s = re.sub(
              r"  var reviewIndex=0;\n  window\.setInterval\(function\(\)\{.*?\n  \},4300\);",
              """  var reviewIndex=0,reviewBaseCount=loopReviews.length;\n  window.setInterval(function(){\n    if(document.hidden || !strip) return;\n    var cards=strip.querySelectorAll('.tm-review');\n    if(!cards.length) return;\n    reviewIndex+=1;\n    if(reviewIndex>=cards.length) reviewIndex=reviewBaseCount;\n    try{strip.scrollTo({left:cards[reviewIndex].offsetLeft-20,behavior:'smooth'});}catch(e){strip.scrollLeft=cards[reviewIndex].offsetLeft-20;}\n    if(reviewIndex>=reviewBaseCount){\n      window.setTimeout(function(){\n        reviewIndex=reviewIndex-reviewBaseCount;\n        try{strip.scrollTo({left:cards[reviewIndex].offsetLeft-20,behavior:'auto'});}catch(e){strip.scrollLeft=cards[reviewIndex].offsetLeft-20;}\n      },720);\n    }\n  },3300);""",
              s,
              count=1,
              flags=re.S,
          )

          # Replace dead hero listener and remove the broken non-existent tmToWorks listener.
          s = s.replace("  root.querySelector('#tmHeroBook').addEventListener('click',function(){root.querySelector('#tmBookingText').textContent='В карточке салона нет подтверждённой ссылки на онлайн-запись. Сейчас можно связаться напрямую.';openOverlay('tmBooking');});",
                        "  root.querySelector('#tmBottomBook').addEventListener('click',function(){root.querySelector('#tmBookingText').textContent='В карточке салона нет подтверждённой ссылки на онлайн-запись. Сейчас можно связаться напрямую.';openOverlay('tmBooking');});\n  root.querySelector('#tmToServices').addEventListener('click',function(){root.querySelector('#tmServices').scrollIntoView({behavior:'smooth',block:'start'});});", 1)
          s = s.replace("  root.querySelector('#tmToWorks').addEventListener('click',function(){root.querySelector('#tmWorks').scrollIntoView({behavior:'smooth',block:'start'});});\n", '', 1)

          # Cleaner dynamic status wording.
          s = s.replace("      if(open){txt.innerHTML='<strong>Открыто до 20:00</strong>';return;}", "      if(open){txt.innerHTML='<strong>Открыто до 20:00</strong>';return;}", 1)
          s = s.replace("      if(day==='Mon') next='Откроется во вторник в 10:00';\n      else if(mins<600) next='Откроется сегодня в 10:00';\n      else if(day==='Sun') next='Откроется во вторник в 10:00';\n      else next='Откроется завтра в 10:00';\n      txt.innerHTML='<strong>Закрыто</strong> · '+next;",
                        "      if(day==='Mon') next='откроется во вторник в 10:00';\n      else if(mins<600){txt.innerHTML='<strong>Закрыто до 10:00</strong>';return;}\n      else if(day==='Sun') next='откроется во вторник в 10:00';\n      else next='откроется завтра в 10:00';\n      txt.innerHTML='<strong>Закрыто</strong> · '+next;", 1)

          p.write_text(s, encoding='utf-8')

          # Force browsers to load the new mobile bundle.
          ip = Path('index.html')
          html = ip.read_text(encoding='utf-8')
          html = re.sub(r'mobile-salon-tahmina-v1\.js\?v=[^"\']+', 'mobile-salon-tahmina-v1.js?v=20260828-ui3', html)
          ip.write_text(html, encoding='utf-8')
          PY
      - name: Commit patched site
        run: |
          git config user.name tanem
          git config user.email melikyan.mac@gmail.com
          git add mobile-salon-tahmina-v1.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refine STLuxe mobile booking services and reviews"
            git push
          fi