name: Verify STLuxe v11 navigation fix
on:
  push:
    paths:
      - '.github/workflows/qa-v11-navfix-final.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live mobile v11
        run: |
          mkdir -p qa-v11-live
          cat > qa-v11-live/shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.goto('https://ichaey.github.io/STLuxe/?qa=v11-navfix',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#stluxe-clean-v11',{timeout:20000});
          await page.waitForTimeout(1400);
          const root=page.locator('#stluxe-clean-v11');
          const count=await root.locator('#v11Bookbar .v11-book-count').innerText();
          if(!count.includes('17 услуг')) throw new Error('Wrong service count: '+count);
          await page.screenshot({path:'qa-v11-live/top.png',fullPage:false});
          await page.screenshot({path:'qa-v11-live/full.png',fullPage:true});

          await root.locator('#services').scrollIntoViewIfNeeded(); await page.waitForTimeout(500);
          const reserve=root.locator('.v11-service-book').first();
          const reserveColor=await reserve.evaluate(el=>getComputedStyle(el).color);
          if(!reserveColor.includes('255')) throw new Error('Booking text is not white: '+reserveColor);
          await page.screenshot({path:'qa-v11-live/services.png',fullPage:false});

          await root.locator('#team').scrollIntoViewIfNeeded(); await page.waitForTimeout(650);
          let active=root.locator('.v11-nav-sticky button.active');
          if((await active.innerText())!=='Команда') throw new Error('Expected Команда, got '+await active.innerText());
          let box=await active.boundingBox(); if(!box||box.x<0||box.x+box.width>390) throw new Error('Команда outside nav viewport');
          await page.screenshot({path:'qa-v11-live/team.png',fullPage:false});
          await root.locator('[data-master="tatiana"]').click(); await page.waitForTimeout(350);
          await page.screenshot({path:'qa-v11-live/master.png',fullPage:false});
          await root.locator('#v11MasterClose').click();

          await root.locator('#reviews').scrollIntoViewIfNeeded(); await page.waitForTimeout(650);
          active=root.locator('.v11-nav-sticky button.active');
          if((await active.innerText())!=='Отзывы') throw new Error('Expected Отзывы, got '+await active.innerText());
          box=await active.boundingBox(); if(!box||box.x<0||box.x+box.width>390) throw new Error('Отзывы outside nav viewport');
          await page.screenshot({path:'qa-v11-live/reviews.png',fullPage:false});

          await root.locator('#gallery').scrollIntoViewIfNeeded(); await page.waitForTimeout(400);
          await root.locator('.v11-open-gallery').click(); await page.waitForTimeout(300);
          const galleryActive=root.locator('#v11GalleryTabs button.active');
          const galleryColor=await galleryActive.evaluate(el=>getComputedStyle(el).color);
          if(!galleryColor.includes('255')) throw new Error('Gallery active text is not white: '+galleryColor);
          await page.screenshot({path:'qa-v11-live/gallery.png',fullPage:false});
          await browser.close();
          JS
          node qa-v11-live/shot.mjs
      - name: Commit screenshots
        run: |
          rm -f qa-v11-live/shot.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-v11-live
          git commit -m 'Capture verified STLuxe v11 live QA'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: stluxe-v11-live-qa
          path: qa-v11-live/*.png
          retention-days: 1
