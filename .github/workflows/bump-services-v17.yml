name: Bump services v17
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump dark services cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='mobile-stluxe-services-v17.js?v=20260829-services-dark1'
          new='mobile-stluxe-services-v17.js?v=20260829-services-dark2'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('services v17 dark1 marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump dark services v17 cache key"
          git push
