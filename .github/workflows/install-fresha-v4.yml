name: Install STLuxe mobile v4 patch
on:
  push:
    paths:
      - 'mobile-fresha-v4-patch.js'
      - '.github/workflows/install-fresha-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect mobile v4 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script defer src="mobile-fresha-v4-patch.js?v=20260828-1500"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable STLuxe mobile v4 patch"
          git push