name: Polish clean STLuxe v10

on:
  push:
    paths:
      - '.github/workflows/polish-clean-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final reference fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-clean-v10.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'assets/images/yandex-gallery/stluxe-01.webp',\n    'assets/images/yandex-gallery/stluxe-02.webp',\n    'assets/images/yandex-gallery/stluxe-03.webp'", "'assets/images/nails-pink.webp',\n    'assets/images/nails-light.webp',\n    'assets/images/hair-style.webp'")
          s=s.replace('125 оценок','126 оценок')
          s=s.replace('<span class="stars">★ ★</span><strong>4,9</strong><span class="stars">★ ★</span>','<span class="stars">★ ★ ★</span><strong>4,9</strong><span class="stars">★ ★</span>')
          s=s.replace("bookbar.classList.toggle('show',heroBottom<=window.innerHeight)","bookbar.classList.toggle('show',heroBottom<=0)")
          p.write_text(s,encoding='utf-8')
          PY
          node --check mobile-stluxe-clean-v10.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-clean-v10.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish clean STLuxe mobile v10"
          git push
