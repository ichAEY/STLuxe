name: One-time STLuxe v38 about

on:
  push:
    paths:
      - '.github/workflows/one-time-v38-about.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add about script to page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='<script defer src="mobile-stluxe-final-v22.js?v=20260830-v37-hero-actions"></script>'
          if needle not in s:
              raise SystemExit('main mobile script anchor not found')
          add=needle+'\n<script defer src="mobile-stluxe-about-v38.js?v=20260830-v38-about-card"></script>'
          p.write_text(s.replace(needle,add,1))
          PY
      - name: Validate about JS
        run: node --check mobile-stluxe-about-v38.js
      - name: Commit page change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "Load STLuxe about card v38"
          git push
