name: Redesign STLuxe mobile visual system v12
on:
  push:
    paths:
      - '.github/workflows/redesign-stluxe-v12.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-clean-v11.js')
          s=p.read_text()
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('Pattern not found: '+old[:100])
              s=s.replace(old,new)

          rep('.v11-hero-slide{min-width:100%;height:76vw;min-height:292px;max-height:410px;scroll-snap-align:start;border:0;padding:0;background:#eee}',
              '.v11-hero-slide{min-width:100%;height:70vw;min-height:274px;max-height:382px;scroll-snap-align:start;border:0;padding:0;background:#eee}')
          rep('.v11-overview{position:relative;z-index:3;margin-top:-58px;background:#fff;border-radius:26px 26px 0 0;padding:22px 20px 26px}',
              '.v11-overview{position:relative;z-index:3;margin-top:-72px;background:#fff;border-radius:30px 30px 0 0;padding:20px 20px 30px}')
          rep('.v11-overview h1{font-size:33px;line-height:1.04;letter-spacing:-.045em;font-weight:400;margin:0 0 4px}',
              '.v11-overview h1{font-size:31px;line-height:1.04;letter-spacing:-.04em;font-weight:400;margin:0 0 3px}')
          rep('.v11-type{font-size:16px;line-height:1.2;color:#858585;font-weight:400;margin:0 0 16px}',
              '.v11-type{font-size:14.5px;line-height:1.25;color:#8a8a8a;font-weight:400;margin:0 0 15px}')
          rep('.v11-rating{display:flex;align-items:center;gap:7px;font-size:14px;margin-bottom:13px}',
              '.v11-rating{display:flex;align-items:center;gap:6px;font-size:13.5px;margin-bottom:11px}')
          rep('.v11-location{display:flex;gap:10px;align-items:flex-start;background:#f0f0f0;border-radius:14px;padding:13px 14px;font-size:12.8px;line-height:1.42;margin-bottom:20px}',
              '.v11-location{display:flex;gap:10px;align-items:flex-start;background:#f3f3f1;border-radius:13px;padding:12px 13px;font-size:12.7px;line-height:1.42;margin-bottom:22px}')
          rep('.v11-overview-title{font-size:18px;font-weight:500;margin:0 0 8px}',
              '.v11-overview-title{font-size:17px;font-weight:500;margin:0 0 8px}')
          rep('.v11-overview-copy{font-size:14px;line-height:1.52;color:#3f3f3f;margin:0}',
              '.v11-overview-copy{font-size:13.7px;line-height:1.58;color:#444;margin:0}')

          rep('.v11-section{padding:42px 20px;scroll-margin-top:64px;border-top:1px solid rgba(0,0,0,.035)}',
              '.v11-section{padding:46px 20px;scroll-margin-top:62px;border-top:0}')
          rep('.v11-tone-gallery{background:#f7f4f0}', '.v11-tone-gallery{background:#f5f1ec}')
          rep('.v11-tone-team{background:#f3f5f5}', '.v11-tone-team{background:#f5f5f2}')
          rep('.v11-tone-reviews{background:#faf7f2}', '.v11-tone-reviews{background:#f2eee8}')
          rep('.v11-tone-visit{background:#fff}', '.v11-tone-visit{background:#f7f7f5}')
          rep('.v11-section h2{font-size:28px;line-height:1.08;letter-spacing:-.035em;font-weight:500;margin:0 0 20px}',
              '.v11-section h2{font-size:26px;line-height:1.08;letter-spacing:-.03em;font-weight:500;margin:0 0 22px}')

          rep('.v11-gallery-preview{display:grid;grid-template-columns:1.18fr .82fr;grid-template-rows:148px 148px;gap:8px}',
              '.v11-gallery-preview{display:grid;grid-template-columns:1.28fr .72fr;grid-template-rows:154px 154px;gap:7px}')
          rep('.v11-gallery-preview button{border:0;padding:0;border-radius:17px;overflow:hidden;background:#e7e7e7}',
              '.v11-gallery-preview button{border:0;padding:0;border-radius:15px;overflow:hidden;background:#e7e7e7}')
          rep('.v11-open-gallery{width:100%;height:46px;border:1px solid #d6d1cb;background:rgba(255,255,255,.72);border-radius:999px;margin-top:14px;font-size:13.5px}',
              '.v11-open-gallery{width:auto;height:auto;border:0;background:transparent;border-radius:0;margin-top:17px;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:5px;color:#333}')

          rep('.v11-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 18px;padding:0 20px}',
              '.v11-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 13px;padding:0 20px}')
          rep('.v11-pill{border:1px solid #dcdcdc;background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:12.8px;font-weight:400}',
              '.v11-pill{border:1px solid #dedede;background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:12.4px;font-weight:400}')
          rep('.v11-services{display:grid;gap:10px}',
              '.v11-services{display:grid;gap:0;border-top:1px solid #e8e8e8}')
          rep('.v11-service{border:1px solid #e0e0e0;border-radius:17px;padding:15px 14px 15px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff}',
              '.v11-service{border:0;border-bottom:1px solid #e8e8e8;border-radius:0;padding:17px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:transparent}')
          rep('.v11-service-name{font-size:15.5px;line-height:1.32;font-weight:400}',
              '.v11-service-name{font-size:15px;line-height:1.35;font-weight:400}')
          rep('.v11-service-price{font-size:13.5px;color:#747474;margin-top:9px}',
              '.v11-service-price{font-size:12.8px;color:#777;margin-top:6px}')
          rep('.v11-service-book{height:38px;border:0;background:#111!important;color:#fff!important;border-radius:999px;padding:0 14px;font-size:12.5px;font-weight:500;white-space:nowrap}',
              '.v11-service-book{height:36px;border:0;background:#111!important;color:#fff!important;border-radius:999px;padding:0 13px;font-size:12.2px;font-weight:500;white-space:nowrap}')
          rep('.v11-show-more{width:100%;height:45px;border:1px solid #dadada;background:#fff;border-radius:999px;margin-top:13px;font-size:13.5px}',
              '.v11-show-more{width:auto;height:auto;border:0;background:transparent;border-radius:0;margin-top:17px;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:5px;color:#333}')

          rep('.v11-team-all,.v11-reviews-all{border:0;background:transparent;padding:0;font-size:14px;color:#6d4cf6!important;text-decoration:none;white-space:nowrap}',
              '.v11-team-all,.v11-reviews-all{border:0;background:transparent;padding:0;font-size:13px;color:#222!important;text-decoration:underline;text-underline-offset:5px;white-space:nowrap}')
          rep('.v11-team-rail{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 6px;scroll-snap-type:x proximity}',
              '.v11-team-rail{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x proximity}')
          rep('.v11-team-card{width:126px;flex:0 0 126px;border:0;background:transparent;padding:0;text-align:center;scroll-snap-align:start}',
              '.v11-team-card{width:122px;flex:0 0 122px;border:0;background:transparent;padding:0;text-align:center;scroll-snap-align:start}')
          rep('.v11-avatar-wrap{position:relative;width:116px;height:116px;margin:0 auto 18px}',
              '.v11-avatar-wrap{position:relative;width:110px;height:110px;margin:0 auto 13px}')
          rep('.v11-avatar{width:116px;height:116px;border-radius:50%;background:linear-gradient(145deg,#e9e9e9,#d9dddd);border:1px solid rgba(0,0,0,.06);display:grid;place-items:center;font-size:34px;font-weight:400;color:#646464}',
              '.v11-avatar{width:110px;height:110px;border-radius:50%;background:#e7e6e2;border:0;display:grid;place-items:center;font-size:31px;font-weight:400;color:#666}')
          rep('.v11-team-name{font-size:17px;line-height:1.15;font-weight:500;margin-top:2px}',
              '.v11-team-name{font-size:16px;line-height:1.15;font-weight:500;margin-top:0}')
          rep('.v11-team-role{font-size:13.5px;line-height:1.25;margin-top:5px;color:#333}',
              '.v11-team-role{font-size:12.8px;line-height:1.25;margin-top:5px;color:#555}')

          rep('.v11-review-count{border:1px solid #ddd;border-radius:999px;padding:3px 8px;font-size:13px;color:#777;font-weight:400;margin-left:6px}',
              '.v11-review-count{border:0;padding:0;font-size:13px;color:#8a8a8a;font-weight:400;margin-left:5px}')
          rep('.v11-score{padding:4px 0 28px;text-align:center}', '.v11-score{padding:8px 0 30px;text-align:center}')
          rep('.v11-score-visual{position:relative;width:260px;height:150px;margin:0 auto 5px;display:grid;place-items:center}',
              '.v11-score-visual{width:auto;height:auto;margin:0 auto 8px;display:block}')
          rep('.v11-score-number{font-size:76px;letter-spacing:-.065em;font-weight:500;line-height:1}',
              '.v11-score-number{font-size:64px;letter-spacing:-.055em;font-weight:400;line-height:1}')
          rep('.v11-score-title{font-size:21px;font-weight:500;margin-top:1px}.v11-score-copy{font-size:13.5px;line-height:1.45;margin:7px auto 0;max-width:310px;color:#555}',
              '.v11-score-title{font-size:19px;font-weight:500;margin-top:5px}.v11-score-copy{font-size:13px;line-height:1.45;margin:6px auto 0;max-width:310px;color:#666}.v11-score-stars{color:#f7b500;font-size:18px;letter-spacing:3px;margin-top:8px}')
          rep('.v11-review-track{display:flex;width:max-content;gap:10px;padding:0 20px;animation:v11Marquee 105s linear infinite;will-change:transform}',
              '.v11-review-track{display:flex;width:max-content;gap:10px;padding:0 20px;animation:v11Marquee 145s linear infinite;will-change:transform}')
          rep('.v11-review-card{width:286px;min-height:154px;border:1px solid #dfdad4;border-radius:18px;padding:16px;background:#fff;text-align:left;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.025)}',
              '.v11-review-card{width:286px;min-height:150px;border:0;border-radius:17px;padding:17px;background:#fff;text-align:left;text-decoration:none;box-shadow:0 4px 18px rgba(44,35,24,.045)}')

          rep('.v11-map{width:100%;height:235px;border:0;border-radius:18px;margin-top:18px;background:#eee}',
              '.v11-map{width:100%;height:250px;border:0;border-radius:16px;margin-top:20px;background:#eee}')
          rep('.v11-bookbar{position:fixed;left:0;right:0;bottom:0;z-index:180;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid #e6e6e6;padding:10px 18px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:14px;transform:translateY(115%);transition:transform .28s ease}',
              '.v11-bookbar{position:fixed;left:0;right:0;bottom:0;z-index:180;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid #ededed;padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:14px;transform:translateY(115%);transition:transform .28s ease;box-shadow:0 -5px 22px rgba(0,0,0,.035)}')
          rep('.v11-bookbar button{height:47px;border:0;border-radius:999px;background:#0d0d0d!important;color:#fff!important;padding:0 24px;font-size:14.5px;font-weight:500;white-space:nowrap}',
              '.v11-bookbar button{height:44px;border:0;border-radius:999px;background:#0d0d0d!important;color:#fff!important;padding:0 22px;font-size:14px;font-weight:500;white-space:nowrap}')
          rep('.v11-footer{border-top:1px solid #000;background:#101010;color:#fff;text-align:center;padding:34px 20px 42px;font-size:16px;font-weight:500;letter-spacing:.01em}',
              '.v11-footer{border-top:1px solid #000;background:#0c0c0c;color:#fff;text-align:center;padding:38px 20px 46px;font-size:17px;font-weight:500;letter-spacing:.005em}')

          rep("return masters.map(m=>'<button class=\"v11-team-card\" type=\"button\" data-master=\"'+m.id+'\"><div class=\"v11-avatar-wrap\"><div class=\"v11-avatar\">'+m.initial+'</div><div class=\"v11-team-badge\"><span class=\"star\">★</span><span>STLuxe</span></div></div><div class=\"v11-team-name\">'+m.name+'</div><div class=\"v11-team-role\">'+m.role+'</div><div class=\"v11-team-cat\">'+m.category+'</div></button>').join('');",
              "return masters.map(m=>'<button class=\"v11-team-card\" type=\"button\" data-master=\"'+m.id+'\"><div class=\"v11-avatar-wrap\"><div class=\"v11-avatar\">'+m.initial+'</div></div><div class=\"v11-team-name\">'+m.name+'</div><div class=\"v11-team-role\">'+m.role+'</div><div class=\"v11-team-cat\">'+m.category+'</div></button>').join('');")
          rep('<button class="v11-open-gallery" type="button" data-gallery-open="all">Открыть галерею</button>',
              '<button class="v11-open-gallery" type="button" data-gallery-open="all">Все фотографии →</button>')
          rep('<div class="v11-score-visual" aria-label="Рейтинг ${RATING}">\n            <span class="v11-score-star s1">★</span><span class="v11-score-star s2">★</span><span class="v11-score-star s3">★</span><span class="v11-score-number">${RATING}</span><span class="v11-score-star s4">★</span><span class="v11-score-star s5">★</span>\n          </div>\n          <div class="v11-score-title">Очень рекомендуют</div>\n          <div class="v11-score-copy">${REVIEWS_COUNT} отзывов клиентов на Яндекс Картах</div>',
              '<div class="v11-score-visual" aria-label="Рейтинг ${RATING}"><span class="v11-score-number">${RATING}</span><div class="v11-score-stars">★★★★★</div></div>\n          <div class="v11-score-title">Очень рекомендуют</div>\n          <div class="v11-score-copy">${REVIEWS_COUNT} отзывов на Яндекс Картах</div>')

          # simplify profile services too
          rep('.v11-profile-service{border:1px solid #dedede;border-radius:17px;padding:15px;margin-bottom:9px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}',
              '.v11-profile-service{border:0;border-bottom:1px solid #e7e7e7;border-radius:0;padding:16px 0;margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}')

          p.write_text(s)
          PY
          node --check mobile-stluxe-clean-v11.js
      - name: Commit redesign
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile-stluxe-clean-v11.js
          git commit -m "Redesign STLuxe mobile visual system v12"
          git push
