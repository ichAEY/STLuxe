name: Refine TANEM services v21 descriptions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine description overflow logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-services-v21.js')
          s=p.read_text()
          old="""  function row(s,index){
    const longDesc=s.desc && s.desc.length>54;
    return `<div class=\"tn21-row\" data-index=\"${index}\"><div class=\"tn21-main\"><div class=\"tn21-name\">${s.title}</div>${s.desc?`<div class=\"tn21-desc\"><span class=\"tn21-desc-text${longDesc?' collapsed':''}\">${s.desc}</span>${longDesc?`<button class=\"tn21-more\" type=\"button\" data-more=\"${index}\">Ещё</button>`:''}</div>`:''}</div><div class=\"tn21-price\">${s.price}</div></div>`;
  }
"""
          new="""  function row(s,index){
    return `<div class=\"tn21-row\" data-index=\"${index}\"><div class=\"tn21-main\"><div class=\"tn21-name\">${s.title}</div>${s.desc?`<div class=\"tn21-desc\"><span class=\"tn21-desc-text collapsed\">${s.desc}</span><button class=\"tn21-more\" type=\"button\" data-more=\"${index}\" hidden>Ещё</button></div>`:''}</div><div class=\"tn21-price\">${s.price}</div></div>`;
  }
"""
          if old not in s:
              raise SystemExit('row block not found')
          s=s.replace(old,new,1)
          old2="""    list.querySelectorAll('.tn21-more').forEach(btn=>btn.addEventListener('click',()=>{
      const r=btn.closest('.tn21-row');
      const t=r && r.querySelector('.tn21-desc-text');
      if(t){t.classList.remove('collapsed');btn.remove();}
    }));
"""
          new2="""    list.querySelectorAll('.tn21-more').forEach(btn=>btn.addEventListener('click',()=>{
      const r=btn.closest('.tn21-row');
      const t=r && r.querySelector('.tn21-desc-text');
      if(t){t.classList.remove('collapsed');btn.remove();}
    }));
    requestAnimationFrame(()=>{
      list.querySelectorAll('.tn21-desc').forEach(box=>{
        const t=box.querySelector('.tn21-desc-text');
        const btn=box.querySelector('.tn21-more');
        if(!t||!btn) return;
        if(t.scrollHeight>t.clientHeight+1){btn.hidden=false;}
        else{t.classList.remove('collapsed');btn.remove();}
      });
    });
"""
          if old2 not in s:
              raise SystemExit('render listener block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          i=Path('index.html')
          h=i.read_text()
          h=h.replace('mobile-stluxe-services-v21.js?v=20260829-services-v21','mobile-stluxe-services-v21.js?v=20260829-services-v21b')
          i.write_text(h)
          PY
          node --check mobile-stluxe-services-v21.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-services-v21.js index.html
          git commit -m "Refine TANEM service description expansion"
          git push
