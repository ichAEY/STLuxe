name: Polish portfolio v15
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final portfolio tone polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-portfolio-v15.js')
          s=p.read_text()
          old='filter:saturate(.76) sepia(.08) brightness(.89) contrast(1.03);'
          new='filter:saturate(.58) sepia(.12) brightness(.86) contrast(1.04);'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          q=Path('index.html')
          x=q.read_text()
          x=x.replace('mobile-stluxe-portfolio-v15.js?v=20260829-portfolio1','mobile-stluxe-portfolio-v15.js?v=20260829-portfolio2')
          q.write_text(x)
          PY
          node --check mobile-stluxe-portfolio-v15.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-portfolio-v15.js index.html
          git commit -m "Polish portfolio image tones v15"
          git push
