name: One-time STLuxe v39 about

on:
  push:
    paths:
      - '.github/workflows/one-time-v39-about.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update about cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='mobile-stluxe-about-v38.js?v=20260830-v38-about-card'
          new='mobile-stluxe-about-v38.js?v=20260830-v39-nonna-about'
          if old not in s:
              raise SystemExit('about script anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate about JS
        run: node --check mobile-stluxe-about-v38.js
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "Cache bust STLuxe Nonna-style about v39"
          git push
