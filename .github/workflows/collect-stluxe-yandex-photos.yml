name: Collect STLuxe Yandex photos

on:
  push:
    paths:
      - '.github/workflows/collect-stluxe-yandex-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Pillow
        run: |
          pip install --quiet playwright pillow requests
          python -m playwright install --with-deps chromium
      - name: Collect real Yandex gallery images
        run: |
          cat > /tmp/collect.py <<'PY'
          import asyncio, re, requests
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright

          URL='https://yandex.com/maps/org/beauty_salon_stluxe/51087098664/gallery/'
          found=[]
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  page=await b.new_page(viewport={"width":390,"height":844})
                  def catch(resp):
                      u=resp.url
                      if 'avatars.mds.yandex.net/get-altay/' in u and u not in found:
                          found.append(u)
                  page.on('response', catch)
                  await page.goto(URL, wait_until='domcontentloaded', timeout=90000)
                  await page.wait_for_timeout(5000)
                  for _ in range(10):
                      await page.mouse.wheel(0, 1200)
                      await page.wait_for_timeout(900)
                  await b.close()
          asyncio.run(main())

          clean=[]
          seen=set()
          for u in found:
              base=re.sub(r'/(?:XXL_height|L_height|M_height|orig)$','/XXL_height',u)
              if base not in seen:
                  seen.add(base); clean.append(base)
          Path('assets/images/yandex-gallery').mkdir(parents=True, exist_ok=True)
          ok=[]
          for i,u in enumerate(clean[:24],1):
              try:
                  r=requests.get(u,timeout=25,headers={'User-Agent':'Mozilla/5.0'}); r.raise_for_status()
                  im=Image.open(BytesIO(r.content)).convert('RGB')
                  if im.width < 500 or im.height < 350: continue
                  im.thumbnail((1600,1600), Image.Resampling.LANCZOS)
                  path=Path(f'assets/images/yandex-gallery/stluxe-{len(ok)+1:02d}.webp')
                  im.save(path,'WEBP',quality=82,method=6)
                  ok.append((str(path),u,im.size))
                  if len(ok)>=12: break
              except Exception as e:
                  print('skip',u,e)
          Path('assets/images/yandex-gallery/sources.txt').write_text('\n'.join(f'{p}\t{s}\t{size}' for p,s,size in ok),encoding='utf-8')
          print('saved',len(ok))
          PY
          python /tmp/collect.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/yandex-gallery || true
          if git diff --cached --quiet; then
            echo "No gallery images collected"
          else
            git commit -m "Collect real STLuxe Yandex gallery photos"
            git push
          fi
