name: STLuxe v52 gallery patch

on:
  push:
    paths:
      - .github/workflows/one-time-v52-gallery-assets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/v52_gallery_patch.py
      - run: node --check mobile-stluxe-final-v22.js
      - run: grep -q "mobile-stluxe-final-v22.js?v=20260831-v52-gallery-assets" index.html
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('mobile-stluxe-final-v22.js').read_text()
          g=s[s.index('const GALLERY={'):s.index('const REVIEW_DATA=[')]
          required=['hair.webp','hair2.webp','hair3.webp','hair4.webp','hair5.webp','hair6.webp','hair7.webp','hair8.webp','nails.webp','nails2.webp','nails3.webp','nails4.webp','nails5.webp','nails6.webp','nails7.webp','nails8.webp','nails9.webp','nails10.webp','nails11.webp','nails12.webp','res.webp','salon.webp','salon2.webp','salon3.webp','salon4.webp','salon6.webp','salon7.webp','salon8.webp','salon9.webp','salon10.webp','salon11.webp','salon12.webp','salon13.webp']
          assert all(x in g for x in required)
          assert 'assets/images/hair-style.webp' not in g
          assert 'assets/images/salon-nail-zone.webp' not in g
          assert "{src:'salon5.webp'" not in g
          portfolio=g[g.index('const PORTFOLIO=['):]
          assert "src:'salon" not in portfolio
          assert 'res.webp' in portfolio and 'hair.webp' in portfolio and 'nails2.webp' in portfolio
          print('gallery distribution validated')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Use uploaded STLuxe photos in gallery and portfolio"
          git push
