name: Enable final TANEM blocks v18-v20
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect team reviews visit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script defer src="mobile-stluxe-services-v17.js?v=20260829-services-dark2"></script>'
          add='''<script defer src="mobile-stluxe-services-v17.js?v=20260829-services-dark2"></script>\n<script defer src="mobile-stluxe-team-v18.js?v=20260829-team1"></script>\n<script defer src="mobile-stluxe-reviews-v19.js?v=20260829-reviews1"></script>\n<script defer src="mobile-stluxe-visit-v20.js?v=20260829-visit1"></script>'''
          if 'mobile-stluxe-team-v18.js' in s:
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('services v17 dark2 marker not found')
          p.write_text(s.replace(marker,add,1))
          PY
          node --check mobile-stluxe-team-v18.js
          node --check mobile-stluxe-reviews-v19.js
          node --check mobile-stluxe-visit-v20.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable TANEM team reviews visit mobile blocks"
          git push
