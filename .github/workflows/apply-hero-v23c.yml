name: Apply STLuxe hero swipe v23c
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_v23_hero.py
      - run: node --check mobile-stluxe-final-v22.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply robust STLuxe hero swipe v23c"
          git push
