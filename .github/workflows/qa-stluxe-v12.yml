name: QA STLuxe visual redesign v12
on:
  push:
    paths:
      - '.github/workflows/qa-stluxe-v12.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture mobile states
        run: |
          mkdir -p qa-v12
          cat > qa-v12/shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.goto('https://ichaey.github.io/STLuxe/?qa=v12',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#stluxe-clean-v11',{timeout:20000});
          await page.waitForTimeout(1200);
          const root=page.locator('#stluxe-clean-v11');
          await page.screenshot({path:'qa-v12/top.png'});
          await page.screenshot({path:'qa-v12/full.png',fullPage:true});
          for(const [id,name] of [['gallery','portfolio'],['services','services'],['team','team'],['reviews','reviews'],['visit','visit']]){
            await root.locator('#'+id).evaluate(el=>window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-54,behavior:'instant'}));
            await page.waitForTimeout(400);
            await page.screenshot({path:'qa-v12/'+name+'.png'});
          }
          const active=await root.locator('.v11-nav-sticky button.active').innerText();
          if(active!=='Визит') throw new Error('Sticky nav active section mismatch: '+active);
          const serviceButton=root.locator('.v11-service-book').first();
          const serviceColor=await serviceButton.evaluate(el=>getComputedStyle(el).color);
          if(!serviceColor.includes('255')) throw new Error('Service button text is not white: '+serviceColor);
          await browser.close();
          JS
          node qa-v12/shot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stluxe-v12-qa
          path: qa-v12/*.png
          retention-days: 1
