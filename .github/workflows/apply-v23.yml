name: Apply STLuxe mobile v23 refinement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v23 refinement
        run: python3 scripts/refine_v23.py
      - name: Validate mobile JS
        run: node --check mobile-stluxe-final-v22.js
      - name: Bump mobile cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s2,n=re.subn(r'mobile-stluxe-final-v22\.js\?v=[^"\']+', 'mobile-stluxe-final-v22.js?v=20260830-v23', s, count=1)
          if n!=1: raise SystemExit('mobile v22 script tag not found')
          p.write_text(s2)
          PY
      - name: Commit refined version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine STLuxe mobile interactions and layout v23"
          git push
