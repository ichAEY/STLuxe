name: One-time STLuxe services reviews master v30

on:
  push:
    paths:
      - '.github/workflows/one-time-services-reviews-master-v30.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only services reviews and master detail
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          path=Path('mobile-stluxe-final-v22.js')
          s=path.read_text()
          old=subprocess.check_output(['git','show','35644a9482f0b843dc80e856b16e0c91fe5b84cd:mobile-stluxe-final-v22.js'],text=True)

          services_css=r'''#tn13Services{margin:0!important;padding:0!important;background:#f7f2eb!important;color:#171513!important;overflow:hidden!important}.tn30-services{padding:42px 26px 40px}.tn30-services .tn22-kicker{color:#756c66}.tn30-services h2{width:205px;margin:17px 0 0;font:500 52px/.9 'Cormorant Garamond',Georgia,serif;letter-spacing:-.035em;color:#171513}.tn30-service-list{margin-top:34px;border-top:1px solid rgba(59,48,42,.17)}.tn30-service-row{min-height:84px;display:grid;grid-template-columns:minmax(0,1fr) 82px 100px;gap:10px;align-items:center;border-bottom:1px solid rgba(59,48,42,.17)}.tn30-service-name{min-width:0;font:500 17px/1.18 'Cormorant Garamond',Georgia,serif;color:#171513}.tn30-service-price{font:500 16px/1 'Cormorant Garamond',Georgia,serif;color:#49413c;white-space:nowrap}.tn30-service-book{width:100px;height:38px;padding:0!important;border:1px solid #4b4541!important;border-radius:5px!important;background:transparent!important;color:#171513!important;display:flex;align-items:center;justify-content:center;box-shadow:none!important;font:500 12px/1 'Manrope',Arial,sans-serif!important;white-space:nowrap}.tn30-service-more{width:100%;height:49px;margin-top:22px;padding:0!important;border:1px solid #c7bbb1!important;border-radius:8px!important;background:transparent!important;color:#403a36!important;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:none!important;font:500 12px/1 'Manrope',Arial,sans-serif!important}.tn30-service-more span{font-size:18px;line-height:1;color:#8d7e73}.tn30-service-more[hidden]{display:none!important}'''

          reviews_css=r'''#tn13Reviews{margin:0!important;padding:0!important;background:radial-gradient(circle at 22% 18%,rgba(115,98,80,.07),transparent 30%),linear-gradient(180deg,#11100f 0%,#12110f 100%)!important;color:#f5efe8!important;overflow:hidden!important}.tn30-reviews{padding:44px 0 46px}.tn30-reviews>.tn22-kicker,.tn30-reviews>h2{margin-left:24px;margin-right:24px}.tn30-reviews .tn22-kicker{color:#c7bbb1}.tn30-reviews h2{margin-top:16px;font:500 45px/.96 'Cormorant Garamond',Georgia,serif;letter-spacing:-.03em;color:#f7f1eb}.tn30-score{text-align:center;margin-top:42px}.tn30-score strong{display:block;font:500 82px/.82 'Cormorant Garamond',Georgia,serif;color:#fff}.tn30-stars{margin-top:18px;color:#d7ad66;font-size:27px;letter-spacing:6px}.tn30-count{margin-top:13px;font:400 13px/1 'Manrope',Arial,sans-serif;color:#d6cec8}.tn30-review-stage{display:grid;gap:12px;margin:36px 22px 0;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none}.tn30-review-stage.dragging{cursor:grabbing}.tn30-lane{width:100%;overflow:hidden}.tn30-track{display:flex;width:100%;gap:12px;will-change:transform}.tn30-review-card{flex:0 0 100%;box-sizing:border-box;min-height:142px;padding:16px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:rgba(255,255,255,.025);text-decoration:none!important;color:#f5efe8!important}.tn30-review-head{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center}.tn30-review-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#4a423c,#2a2724);border:1px solid rgba(215,173,102,.22);font:500 24px/1 'Cormorant Garamond',Georgia,serif;color:#f4e8da}.tn30-review-name{display:block;font:500 20px/1 'Cormorant Garamond',Georgia,serif;color:#ead8c2}.tn30-review-meta{display:block;margin-top:5px;font:500 9.5px/1 'Manrope',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#958c85}.tn30-review-card p{margin:13px 0 0;font:400 13px/1.5 'Manrope',Arial,sans-serif;color:#eee7e1}.tn30-review-open{display:block;margin-top:11px;font:500 9.5px/1 'Manrope',Arial,sans-serif;color:#c9a574}.tn30-review-all{display:flex;align-items:center;justify-content:center;margin:27px 22px 0;height:46px;border:1px solid rgba(255,255,255,.28);border-radius:6px;color:#ead8c2!important;text-decoration:none!important;font:500 11px/1 'Manrope',Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}'''

          services_js=r'''// SERVICES
const serv=$('#tn13Services');let servicesExpanded=false;
serv.innerHTML=`<div class="tn30-services"><p class="tn22-kicker">Услуги</p><h2>Наши услуги</h2><div class="tn30-service-list"></div><button class="tn30-service-more" type="button"><span class="tn30-more-text">Показать все услуги</span><span aria-hidden="true">↓</span></button></div>`;
const slist=serv.querySelector('.tn30-service-list'),sMore=serv.querySelector('.tn30-service-more');
function firstService(test){return SERVICES.find(test)}
const preferred=[
  firstService(s=>s.title.startsWith('Стрижка и укладка')),
  firstService(s=>s.title.startsWith('Окрашивание в 1 тон')),
  firstService(s=>s.cat==='Маникюр'),
  firstService(s=>s.cat==='Педикюр'),
  firstService(s=>s.cat==='Наращивание'),
  firstService(s=>s.cat==='Детям'),
  firstService(s=>s.cat==='Мужчинам')
].filter(Boolean);
for(const item of SERVICES){if(preferred.length>=7)break;if(!preferred.includes(item))preferred.push(item)}
function previewService(s){const parts=s.title.split(' — ');return {title:parts[0],price:parts.length>1&&!/^от\s/i.test(s.price)?`от ${s.price}`:s.price}}
function serviceLine(s){return `<div class="tn30-service-row"><div class="tn30-service-name">${s.title}</div><div class="tn30-service-price">${s.price}</div><button class="tn30-service-book" type="button" data-book-service>Записаться</button></div>`}
function renderServices(){const rows=servicesExpanded?SERVICES:preferred.map(previewService);slist.innerHTML=rows.map(serviceLine).join('');slist.querySelectorAll('[data-book-service]').forEach(b=>b.onclick=book);sMore.querySelector('.tn30-more-text').textContent=servicesExpanded?'Свернуть':'Показать все услуги';sMore.querySelector('span:last-child').textContent=servicesExpanded?'↑':'↓'}
sMore.onclick=()=>{servicesExpanded=!servicesExpanded;renderServices()};renderServices();

'''

          reviews_js=r'''// REVIEWS
const reviews=$('#tn13Reviews');
const REVIEW_SHOWCASE=[
{name:'мария н.',text:'Уютная атмосфера, тёплый приём и быстрая качественная работа Татьяны.'},
{name:'Ольга К.',text:'Химическая завивка, чистота, стерильность и приветливый персонал.'},
{name:'Оксана Семина',text:'Ногти, кератин, окрашивание и стрижка у Татьяны очень понравились.'},
{name:'Дарья К.',text:'Ценит индивидуальный подход, стойкий маникюр и удачные семейные стрижки.'},
{name:'Надежда Донеско',text:'Отмечает стерильность, выбор дизайнов и массажное кресло для педикюра.'},
{name:'Галина Б.',text:'Давно ходит в салон и рекомендует Татьяну и Алёну.'},
{name:'Ольга 🐝',text:'Хвалит маникюр, окрашивание, профессионализм Татьяны и высокий сервис.'},
{name:'Галина Михайлова',text:'Довольна результатом, уютом, сервисом и демократичными ценами.'},
{name:'Наталья Маслова',text:'Отмечает доброжелательность, детский уголок, маникюр, педикюр и брови.'},
{name:'Алина Сергеева',text:'Благодарит Татьяну за маникюр, профессионализм и внимание к пожеланиям.'},
{name:'Юлия Логинова',text:'Хвалит профессиональную команду, современные материалы и продуманный интерьер.'},
{name:'Олеся Полянская',text:'Рекомендует Татьяну и Алёну, отмечает уют, цены и результат.'},
{name:'Анастасия',text:'Много лет доверяет Татьяне стрижки, окрашивания и эксперименты с волосами.'},
{name:'Natalya N.',text:'Даже после переезда продолжает приезжать к Татьяне на маникюр.'},
{name:'О. Д.',text:'Довольна маникюром, педикюром, окрашиванием, стрижками и вежливостью персонала.'}
];
const reviewInitial=n=>([...n.trim()][0]||'S').toUpperCase();
const reviewCard=r=>`<a class="tn30-review-card" href="${YANDEX_REVIEWS}" target="_blank" rel="noopener"><div class="tn30-review-head"><span class="tn30-review-avatar">${reviewInitial(r.name)}</span><span><strong class="tn30-review-name">${r.name}</strong><span class="tn30-review-meta">Яндекс Карты</span></span></div><p>${r.text}</p><span class="tn30-review-open">Открыть оригинал отзыва →</span></a>`;
const reviewLanes=[0,1,2].map(row=>REVIEW_SHOWCASE.filter((_,i)=>i%3===row));
reviews.innerHTML=`<div class="tn30-reviews"><p class="tn22-kicker">Отзывы</p><h2>Что говорят о нас</h2><div class="tn30-score"><strong>4,9</strong><div class="tn30-stars">★★★★★</div><div class="tn30-count">86 отзывов на Яндекс Картах</div></div><div class="tn30-review-stage">${reviewLanes.map((lane,i)=>{const loop=[lane[lane.length-1],...lane,lane[0]];return `<div class="tn30-lane" data-lane="${i}"><div class="tn30-track">${loop.map(reviewCard).join('')}</div></div>`}).join('')}</div><a class="tn30-review-all" href="${YANDEX_REVIEWS}" target="_blank" rel="noopener">Смотреть все отзывы →</a></div>`;
const reviewStage=reviews.querySelector('.tn30-review-stage'),reviewTracks=[...reviews.querySelectorAll('.tn30-track')];
let reviewIndex=1,reviewPauseTimer=0,reviewMotionTimer=0,reviewDragging=false,reviewMoved=false,reviewSuppressClick=false,reviewStartX=0,reviewStartY=0,reviewDx=0;
const reviewGap=12,reviewDuration=650;
function reviewStep(){const lane=reviews.querySelector('.tn30-lane');return lane?lane.clientWidth+reviewGap:0}
function paintReviewTracks(animated,drag=0){const step=reviewStep();reviewTracks.forEach(t=>{t.style.transition=animated?`transform ${reviewDuration}ms cubic-bezier(.22,.72,.22,1)`:'none';t.style.transform=`translate3d(${-reviewIndex*step+drag}px,0,0)`})}
function scheduleReviews(){clearTimeout(reviewPauseTimer);reviewPauseTimer=setTimeout(()=>moveReviews(reviewIndex+1),4000)}
function normalizeReviewIndex(){if(reviewIndex===0){reviewIndex=5;paintReviewTracks(false)}else if(reviewIndex===6){reviewIndex=1;paintReviewTracks(false)}}
function moveReviews(next){clearTimeout(reviewPauseTimer);clearTimeout(reviewMotionTimer);reviewIndex=Math.max(0,Math.min(6,next));paintReviewTracks(true);reviewMotionTimer=setTimeout(()=>{normalizeReviewIndex();scheduleReviews()},reviewDuration+30)}
requestAnimationFrame(()=>{paintReviewTracks(false);scheduleReviews()});
window.addEventListener('resize',()=>paintReviewTracks(false),{passive:true});
reviewStage.addEventListener('pointerdown',e=>{clearTimeout(reviewPauseTimer);clearTimeout(reviewMotionTimer);reviewDragging=true;reviewMoved=false;reviewDx=0;reviewStartX=e.clientX;reviewStartY=e.clientY;reviewStage.classList.add('dragging');paintReviewTracks(false);try{reviewStage.setPointerCapture(e.pointerId)}catch(_){}});
reviewStage.addEventListener('pointermove',e=>{if(!reviewDragging)return;const dx=e.clientX-reviewStartX,dy=e.clientY-reviewStartY;if(!reviewMoved&&Math.abs(dx)<6)return;if(!reviewMoved&&Math.abs(dy)>Math.abs(dx))return;reviewMoved=true;reviewDx=dx;paintReviewTracks(false,reviewDx)});
function finishReviewDrag(e){if(!reviewDragging)return;reviewDragging=false;reviewStage.classList.remove('dragging');try{reviewStage.releasePointerCapture(e.pointerId)}catch(_){}const step=reviewStep();if(reviewMoved&&Math.abs(reviewDx)>Math.min(70,step*.16))reviewIndex+=reviewDx<0?1:-1;reviewIndex=Math.max(0,Math.min(6,reviewIndex));reviewSuppressClick=reviewMoved;reviewDx=0;paintReviewTracks(true);clearTimeout(reviewMotionTimer);reviewMotionTimer=setTimeout(()=>{normalizeReviewIndex();scheduleReviews()},reviewDuration+30)}
reviewStage.addEventListener('pointerup',finishReviewDrag);reviewStage.addEventListener('pointercancel',finishReviewDrag);reviewStage.addEventListener('click',e=>{if(reviewSuppressClick){e.preventDefault();e.stopPropagation();reviewSuppressClick=false}},true);

'''

          def replace(pattern,repl,text,label):
              m=re.search(pattern,text,re.S)
              if not m: raise SystemExit(f'{label} not found')
              return text[:m.start()]+repl+text[m.end():]

          s=replace(r"#tn13Services\{.*?(?=\n\n#tn13Team\{)",services_css,s,'services css')
          s=replace(r"#tn13Reviews\{.*?(?=\n\n#tn13Visit\{)",reviews_css,s,'reviews css')

          master_css_pattern=r"\.tn22-master-page\{.*?\.tn22-master-book\{[^}]*\}"
          om=re.search(master_css_pattern,old,re.S)
          if not om: raise SystemExit('old master css not found')
          s=replace(master_css_pattern,om.group(0),s,'current master css')

          s=replace(r"// SERVICES\n.*?(?=// TEAM \+ TEAM SHEET)",services_js,s,'services js')
          master_js_pattern=r"// MASTER PAGE\n.*?(?=// REVIEWS)"
          om=re.search(master_js_pattern,old,re.S)
          if not om: raise SystemExit('old master js not found')
          s=replace(master_js_pattern,om.group(0),s,'current master js')
          s=replace(r"// REVIEWS\n.*?(?=// VISIT)",reviews_js,s,'reviews js')
          path.write_text(s)

          idx=Path('index.html')
          html=idx.read_text()
          html,n=re.subn(r'mobile-stluxe-final-v22\.js\?v=[^"\']+', 'mobile-stluxe-final-v22.js?v=20260830-v30-services-reviews-master', html, count=1)
          if n!=1: raise SystemExit('cache key not updated')
          idx.write_text(html)
          PY
      - name: Validate focused patch
        run: |
          node --check mobile-stluxe-final-v22.js
          grep -q "tn30-service-list" mobile-stluxe-final-v22.js
          grep -q "REVIEW_SHOWCASE" mobile-stluxe-final-v22.js
          grep -q "tn22-master-tabs" mobile-stluxe-final-v22.js
          grep -q "v30-services-reviews-master" index.html
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "Refine STLuxe services reviews and restore master detail"
          git push
