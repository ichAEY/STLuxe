name: One-time STLuxe services reviews master v30

on:
  push:
    paths:
      - '.github/workflows/one-time-services-reviews-master-v30.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/patch-stluxe-v30.py
      - name: Validate focused patch
        run: |
          node --check mobile-stluxe-final-v22.js
          grep -q "tn30-service-list" mobile-stluxe-final-v22.js
          grep -q "REVIEW_SHOWCASE=REVIEW_DATA.slice(0,15)" mobile-stluxe-final-v22.js
          grep -q "tn22-master-tabs" mobile-stluxe-final-v22.js
          grep -q "v30-services-reviews-master" index.html
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "Refine STLuxe services reviews and restore master detail"
          git push
