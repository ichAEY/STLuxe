name: Bump final TANEM blocks v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps={
            'mobile-stluxe-team-v18.js?v=20260829-team1':'mobile-stluxe-team-v18.js?v=20260829-team2',
            'mobile-stluxe-reviews-v19.js?v=20260829-reviews1':'mobile-stluxe-reviews-v19.js?v=20260829-reviews2',
            'mobile-stluxe-visit-v20.js?v=20260829-visit1':'mobile-stluxe-visit-v20.js?v=20260829-visit2'
          }
          for old,new in reps.items():
            if new in s: continue
            if old not in s: raise SystemExit(f'marker not found: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump TANEM final block cache keys"
          git push
