name: Fix final STLuxe v23 visuals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix service buttons and review CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-final-v22.js')
          s=p.read_text()
          reps=[
            ("grid-template-columns:minmax(0,1fr) 90px","grid-template-columns:minmax(0,1fr) 86px"),
            ("background:#f7f5f2;color:#272321;font:500 11.5px/1 'Manrope',Arial,sans-serif","background:#f7f5f2;color:#272321!important;font:500 11.5px/1 'Manrope',Arial,sans-serif!important"),
            (".tn23-cat-menu{position:absolute;z-index:4;right:0;top:0;width:46px;height:46px;border:1px solid rgba(40,34,31,.16);border-radius:50%;background:#fff;color:#171513;",".tn23-cat-menu{position:absolute;z-index:4;right:0;top:0;width:46px;height:46px;border:1px solid rgba(40,34,31,.16);border-radius:50%;background:#fff;color:#171513!important;"),
            ("background:transparent;color:#292522;text-align:left;padding:0 10px;font:500 11px/1 'Manrope',Arial,sans-serif","background:transparent;color:#292522!important;text-align:left;padding:0 10px;font:500 11px/1 'Manrope',Arial,sans-serif!important"),
            (".tn22-book-mini{width:88px;height:32px;margin-top:9px;padding:0 3px;border:1px solid rgba(241,220,197,.38);border-radius:8px;background:#171411;color:#fff!important;font:500 9px/1 'Manrope',Arial,sans-serif;white-space:nowrap}",".tn22-book-mini{width:84px!important;min-width:0!important;max-width:84px!important;height:32px;margin-top:9px;padding:0 2px;border:1px solid rgba(241,220,197,.38);border-radius:8px;background:#171411;color:#fff!important;font:500 8.5px/1 'Manrope',Arial,sans-serif!important;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}"),
            (".tn22-track.dragging{cursor:grabbing}to{transform:translateX(-50%)}}.tn22-review-card",".tn22-track.dragging{cursor:grabbing}.tn22-review-card")
          ]
          for old,new in reps:
            if old not in s: raise SystemExit('missing marker: '+old[:80])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check mobile-stluxe-final-v22.js
      - name: Bump cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text()
          s2,n=re.subn(r'mobile-stluxe-final-v22\.js\?v=[^"\']+', 'mobile-stluxe-final-v22.js?v=20260830-v23b', s, count=1)
          if n!=1: raise SystemExit('script tag missing')
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix STLuxe v23 service card overflow"
          git push
