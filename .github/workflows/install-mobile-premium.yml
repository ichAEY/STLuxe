name: Install premium mobile STLuxe

on:
  push:
    paths:
      - '.github/workflows/install-mobile-premium.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect premium mobile script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script defer src="mobile-premium.js?v=2"></script>'
          if tag not in s:
              s = s.replace('</body>', f'  {tag}\n</body>')
              p.write_text(s)
          PY
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Already connected"
          else
            git commit -m "Enable premium mobile STLuxe layout"
            git push
          fi
