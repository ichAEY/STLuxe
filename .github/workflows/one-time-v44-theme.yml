name: One-time STLuxe v44 theme

on:
  push:
    paths:
      - '.github/workflows/one-time-v44-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach reversible theme layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script defer src="mobile-stluxe-about-v38.js?v=20260831-v43-about-photo"></script>'
          add=marker+'\n<script defer src="mobile-stluxe-theme-v44.js?v=20260831-v44-salon-theme"></script>'
          if 'mobile-stluxe-theme-v44.js' not in s:
              if marker not in s:
                  raise SystemExit('about script marker not found')
              s=s.replace(marker,add,1)
              p.write_text(s)
          PY
      - name: Validate theme
        run: |
          node --check mobile-stluxe-theme-v44.js
          grep -q "mobile-stluxe-theme-v44.js?v=20260831-v44-salon-theme" index.html
      - name: Commit v44
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable reversible STLuxe salon color theme v44"
          git push
