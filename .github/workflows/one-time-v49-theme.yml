name: One-time STLuxe v49 theme

on:
  push:
    paths:
      - '.github/workflows/one-time-v49-theme.yml'

permissions:
  contents: write

jobs:
  switch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add v49 override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script defer src="mobile-stluxe-theme-v48.js?v=20260831-v48-dark-gray-sections"></script>'
          addition=marker+'\n<script defer src="mobile-stluxe-theme-v49.js?v=20260831-v49-deep-team-master"></script>'
          if 'mobile-stluxe-theme-v49.js' in s:
              raise SystemExit('v49 already connected')
          if marker not in s:
              raise SystemExit('v48 marker not found')
          p.write_text(s.replace(marker,addition,1))
          PY
      - name: Validate
        run: |
          node --check mobile-stluxe-theme-v49.js
          grep -q 'mobile-stluxe-theme-v49.js?v=20260831-v49-deep-team-master' index.html
      - name: Commit switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply STLuxe v49 deep team and master styling"
          git push
