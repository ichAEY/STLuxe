name: Install TANEM salon mobile v13
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and switch mobile layer
        run: |
          node --check mobile-stluxe-tanem-v13.js
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pattern=r'<script defer src="mobile-stluxe-clean-v11\.js\?v=[^"]+"></script>'
          repl='<script defer src="mobile-stluxe-tanem-v13.js?v=20260829-0418"></script>'
          ns,n=re.subn(pattern,repl,s)
          if n != 1:
              raise SystemExit(f'Expected one old mobile script, replaced {n}')
          p.write_text(ns)
          PY
          rm .github/workflows/install-tanem-v13.yml
      - name: Commit TANEM switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/install-tanem-v13.yml
          git commit -m "Switch STLuxe mobile to TANEM v13"
          git push