name: Polish TANEM salon v13
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix services and final facts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-tanem-v13.js')
          s=p.read_text()
          old='.tn13-service-name small{display:block;margin-top:6px;color:#ad9f98;font-size:10.5px}'
          new='.tn13-service-name small{display:none}'
          if old not in s:
              raise SystemExit('service subline style not found')
          s=s.replace(old,new,1)
          s=s.replace('<small>услуг в демо</small>','<small>услуг</small>',1)
          p.write_text(s)
          PY
          node --check mobile-stluxe-tanem-v13.js
          rm .github/workflows/polish-tanem-v13.yml
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-tanem-v13.js .github/workflows/polish-tanem-v13.yml
          git commit -m "Polish STLuxe TANEM v13"
          git push