name: Install clean STLuxe mobile v10

on:
  push:
    paths:
      - '.github/workflows/install-clean-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect only clean v10 mobile layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script defer src="mobile-[^"]+\.js[^\"]*"></script>','',s)
          s=s.replace('</body>','<script defer src="mobile-stluxe-clean-v10.js?v=20260829-0315"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable clean STLuxe mobile v10"
          git push
