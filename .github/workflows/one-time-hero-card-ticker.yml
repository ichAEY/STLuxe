name: One-time STLuxe mobile hero refinement

on:
  push:
    paths:
      - '.github/workflows/one-time-hero-card-ticker.yml'

permissions:
  contents: write

jobs:
  patch-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine mobile hero card and ticker
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('mobile-stluxe-final-v22.js')
          s = js.read_text()

          old_hero = "#stluxe-tanem-v13 .tn13-hero{height:738px!important;min-height:738px!important;padding:0!important;background:#f8f4ee!important;position:relative!important;overflow:hidden!important}"
          new_hero = "#stluxe-tanem-v13 .tn13-hero{height:690px!important;min-height:690px!important;padding:0!important;background:#f8f4ee!important;position:relative!important;overflow:hidden!important}"
          if old_hero not in s:
              raise SystemExit('Expected mobile hero sizing CSS not found')
          s = s.replace(old_hero, new_hero, 1)

          old_card = ".tn22-card{position:absolute;z-index:8;top:343px;left:21px;right:21px;height:314px;padding:20px;border-radius:13px;background:rgba(249,246,241,.985);box-shadow:0 10px 28px rgba(47,37,31,.08);text-align:center}"
          new_card = ".tn22-card{position:absolute;z-index:8;top:343px;left:15px;right:15px;height:326px;padding:20px;border-radius:13px;background:rgba(249,246,241,.985);box-shadow:0 5px 18px rgba(47,37,31,.13),0 1px 4px rgba(47,37,31,.07);text-align:center}"
          if old_card not in s:
              raise SystemExit('Expected hero card CSS not found')
          s = s.replace(old_card, new_card, 1)

          old_ticker = ".tn22-ticker{position:absolute;z-index:7;left:0;right:0;top:682px;height:37px;border-top:1px solid #c9b9a8;border-bottom:1px solid #c9b9a8;overflow:hidden;background:#f4eee6;color:#766a61;display:flex;align-items:center}.tn22-ticker div{display:flex;width:max-content;animation:tn22Tick 30s linear infinite}.tn22-ticker span{padding-right:22px;font:500 10.5px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}"
          new_ticker = ".tn22-ticker{display:none!important;position:absolute;z-index:7;left:0;right:0;top:682px;height:37px;border-top:1px solid #c9b9a8;border-bottom:1px solid #c9b9a8;overflow:hidden;background:#f4eee6;color:#766a61;align-items:center}.tn22-ticker div{display:flex;width:max-content;animation:tn22Tick 30s linear infinite}.tn22-ticker span{padding-right:0;font:500 10.5px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}"
          if old_ticker not in s:
              raise SystemExit('Expected ticker CSS not found')
          s = s.replace(old_ticker, new_ticker, 1)
          js.write_text(s)

          index = Path('index.html')
          h = index.read_text()
          old_ver = 'mobile-stluxe-final-v22.js?v=20260830-v26-active'
          new_ver = 'mobile-stluxe-final-v22.js?v=20260830-v27-hero'
          if old_ver not in h:
              raise SystemExit('Expected script cache key not found')
          index.write_text(h.replace(old_ver, new_ver, 1))
          PY
      - name: Commit mobile hero refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Refine STLuxe mobile hero card and ticker"
          git push
