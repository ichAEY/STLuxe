name: Install rebuilt STLuxe mobile salon

on:
  push:
    paths:
      - 'mobile-salon-tahmina-v1.js'
      - '.github/workflows/install-tahmina-salon-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old mobile layers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script defer src="mobile-fresha-v3.js?v=20260828-1435"></script>\n','')
          s=s.replace('<script defer src="mobile-fresha-v5.js?v=20260828-1525"></script>\n','')
          s=s.replace('</body>','<script defer src="mobile-salon-tahmina-v1.js?v=20260828-1600"></script>\n</body>')
          p.write_text(s)
          PY
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable rebuilt STLuxe mobile salon" || exit 0
          git push
