name: Safe final STLuxe v22 polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust polish script
        run: python3 scripts/polish_v22.py
      - name: Validate consolidated JS
        run: node --check mobile-stluxe-final-v22.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Apply final STLuxe mobile v22 polish"
          git push
