name: One-time STLuxe v50 theme status

on:
  push:
    paths:
      - '.github/workflows/one-time-v50-theme-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch menu, live hero status and connect v50
        run: |
          python - <<'PY'
          from pathlib import Path

          js=Path('mobile-stluxe-final-v22.js')
          s=js.read_text()

          old_menu="navPop.innerHTML='<a href=\"#tn13Portfolio\">Портфолио</a><a href=\"#tn13Services\">Услуги и цены</a><a href=\"#tn13Team\">Команда</a><a href=\"#tn13Reviews\">Отзывы</a><a href=\"#tn13Visit\">Контакты</a>';"
          new_menu="navPop.innerHTML='<a href=\"#tn13Portfolio\">Портфолио</a><a href=\"#tn13Services\">Услуги и цены</a><a href=\"#tn38About\">О салоне</a><a href=\"#tn13Team\">Команда</a><a href=\"#tn13Reviews\">Отзывы</a><a href=\"#tn13Visit\">Контакты</a>';"
          if old_menu not in s:
              raise SystemExit('navPop marker not found')
          s=s.replace(old_menu,new_menu,1)

          old_hero='<span class=\"tn37-info-copy\"><strong>Открыто</strong>до 20:00</span>'
          new_hero='<span class=\"tn37-info-copy tn50-hero-status\"><strong class=\"tn50-hero-status-main\">Проверяем</strong><span class=\"tn50-hero-status-sub\">режим работы</span></span>'
          if old_hero not in s:
              raise SystemExit('hero status marker not found')
          s=s.replace(old_hero,new_hero,1)

          old_status="function status(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value||'';const day=get('weekday'),h=+get('hour'),m=+get('minute'),mins=h*60+m;const el=visit.querySelector('#tn22Status');const monday=day==='Mon',open=!monday&&mins>=600&&mins<1200;const txt=el.querySelector('.tn22-status-text');if(open){txt.textContent='Открыто до 20:00';el.className='tn22-status open'}else{txt.textContent=monday?'Закрыто до вт 10:00':'Закрыто до 10:00';el.className='tn22-status closed'}}status();setInterval(status,60000);"
          new_status="function status(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value||'';const day=get('weekday'),h=+get('hour'),m=+get('minute'),mins=h*60+m;const monday=day==='Mon',sundayLate=day==='Sun'&&mins>=1200,open=!monday&&mins>=600&&mins<1200,closedToTuesday=monday||sundayLate;const closedText=closedToTuesday?'Закрыто до вт 10:00':'Закрыто до 10:00';const el=visit.querySelector('#tn22Status'),txt=el.querySelector('.tn22-status-text');txt.textContent=open?'Открыто до 20:00':closedText;el.className='tn22-status '+(open?'open':'closed');const hs=hero.querySelector('.tn50-hero-status');if(hs){const main=hs.querySelector('.tn50-hero-status-main'),sub=hs.querySelector('.tn50-hero-status-sub');main.textContent=open?'Открыто':'Закрыто';sub.textContent=open?'до 20:00':(closedToTuesday?'до вт 10:00':'до 10:00');hs.classList.toggle('open',open);hs.classList.toggle('closed',!open)}}status();setInterval(status,60000);"
          if old_status not in s:
              raise SystemExit('status function marker not found')
          s=s.replace(old_status,new_status,1)
          js.write_text(s)

          idx=Path('index.html')
          h=idx.read_text()
          old='<script defer src="mobile-stluxe-theme-v49.js?v=20260831-v49-deep-team-master"></script>'
          new=old+'\n<script defer src="mobile-stluxe-theme-v50.js?v=20260831-v50-unified-dark-live-status"></script>'
          if 'mobile-stluxe-theme-v50.js' in h:
              raise SystemExit('v50 already connected')
          if old not in h:
              raise SystemExit('v49 index marker not found')
          h=h.replace(old,new,1)
          h=h.replace('mobile-stluxe-final-v22.js?v=20260831-v47-review-no-dates','mobile-stluxe-final-v22.js?v=20260831-v50-menu-live-status',1)
          idx.write_text(h)
          PY
      - name: Validate
        run: |
          node --check mobile-stluxe-final-v22.js
          node --check mobile-stluxe-theme-v50.js
          grep -q '#tn38About\">О салоне' mobile-stluxe-final-v22.js
          grep -q 'tn50-hero-status-main' mobile-stluxe-final-v22.js
          grep -q "sundayLate=day==='Sun'" mobile-stluxe-final-v22.js
          grep -q 'mobile-stluxe-theme-v50.js?v=20260831-v50-unified-dark-live-status' index.html
          grep -q 'mobile-stluxe-final-v22.js?v=20260831-v50-menu-live-status' index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Apply STLuxe v50 unified dark sections and live status"
          git push
