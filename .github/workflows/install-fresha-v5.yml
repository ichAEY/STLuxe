name: Install corrected STLuxe mobile v5
on:
  push:
    paths:
      - 'mobile-fresha-v5.js'
      - '.github/workflows/install-fresha-v5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect corrected mobile v5
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script defer src="mobile-fresha-v4-patch.js?v=20260828-1500"></script>'
          new='<script defer src="mobile-fresha-v5.js?v=20260828-1525"></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              s=s.replace('</body>',new+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable corrected STLuxe mobile v5"
          git push