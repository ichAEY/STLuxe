name: One-time STLuxe active nav emphasis

on:
  push:
    paths:
      - '.github/workflows/one-time-active-nav-emphasis.yml'

permissions:
  contents: write

jobs:
  patch-active-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emphasize active top menu item
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('mobile-stluxe-final-v22.js')
          s = js.read_text()
          old = ".tn23-section-nav button.active{color:#4b4946}.tn23-section-nav button.active:after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;border-radius:1px;background:#8d8984}"
          new = ".tn23-section-nav button.active{color:#171513;font-weight:600}.tn23-section-nav button.active:after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:#171513}"
          if old not in s:
              raise SystemExit('Expected active nav CSS not found')
          js.write_text(s.replace(old, new, 1))

          index = Path('index.html')
          h = index.read_text()
          old_ver = 'mobile-stluxe-final-v22.js?v=20260830-v25-smoothnav'
          new_ver = 'mobile-stluxe-final-v22.js?v=20260830-v26-active'
          if old_ver not in h:
              raise SystemExit('Expected script cache key not found')
          index.write_text(h.replace(old_ver, new_ver, 1))
          PY
      - name: Commit active nav refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Emphasize active mobile top menu item"
          git push
