name: Switch services v16
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect services v16
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'mobile-stluxe-services-v16.js' in s:
              raise SystemExit(0)
          marker='<script defer src="mobile-stluxe-portfolio-v15.js?v=20260829-portfolio2"></script>'
          if marker not in s:
              raise SystemExit('portfolio v15 marker not found')
          s=s.replace(marker, marker+'\n<script defer src="mobile-stluxe-services-v16.js?v=20260829-services1"></script>',1)
          p.write_text(s)
          PY
          node --check mobile-stluxe-services-v16.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable pixel matched services v16"
          git push
