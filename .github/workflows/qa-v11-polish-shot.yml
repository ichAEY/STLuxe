name: Capture STLuxe v11 final polish
on:
  push:
    paths:
      - '.github/workflows/qa-v11-polish-shot.yml'
permissions:
  contents: read
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - run: |
          mkdir -p qa-polish
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await page.goto('https://ichaey.github.io/STLuxe/?qa=v11-polish',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#stluxe-clean-v11');
          await page.waitForTimeout(1000);
          await page.screenshot({path:'qa-polish/top.png'});
          await page.evaluate(()=>document.querySelector('#stluxe-clean-v11 #team').scrollIntoView({block:'start'}));
          await page.waitForTimeout(600);
          await page.screenshot({path:'qa-polish/team.png'});
          await browser.close();
          JS
          node shot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stluxe-v11-polish-shot
          path: qa-polish/*.png
          retention-days: 1
