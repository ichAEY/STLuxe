name: One-time STLuxe v43

on:
  push:
    paths:
      - '.github/workflows/one-time-v43.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode uploaded STLuxe image
        run: |
          mkdir -p assets/images
          base64 -d .github/tmp/stluxe-about-logo.webp.b64 > assets/images/stluxe-about-logo.webp
          test -s assets/images/stluxe-about-logo.webp
      - name: Apply about and team spacing changes
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('mobile-stluxe-final-v22.js')
          about = Path('mobile-stluxe-about-v38.js')
          index = Path('index.html')

          s = main.read_text()
          old = ".tn22-team-grid{display:flex;gap:14px;margin:30px -28px 0;padding:0 52px 8px 28px;overflow-x:auto;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none}.tn22-team-grid::-webkit-scrollbar{display:none}"
          new = ".tn22-team-grid{display:flex;gap:14px;margin:30px 0 0;padding:0 0 8px;overflow-x:auto;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding:0}.tn22-team-grid::-webkit-scrollbar{display:none}"
          if old not in s:
              raise SystemExit('team grid anchor not found')
          s = s.replace(old, new, 1)
          main.write_text(s)

          a = about.read_text()
          old_img = '<img src="assets/images/stluxe-about-dark.svg" alt="STLux" loading="lazy">'
          new_img = '<img src="assets/images/stluxe-about-logo.webp" alt="STLuxe" loading="lazy">'
          if old_img not in a:
              raise SystemExit('about image anchor not found')
          a = a.replace(old_img, new_img, 1)
          about.write_text(a)

          i = index.read_text()
          i = i.replace('mobile-stluxe-final-v22.js?v=20260831-v42-structure-gallery','mobile-stluxe-final-v22.js?v=20260831-v43-team-gutters')
          i = i.replace('mobile-stluxe-about-v38.js?v=20260831-v42-about-card','mobile-stluxe-about-v38.js?v=20260831-v43-about-photo')
          index.write_text(i)
          PY
      - name: Validate JavaScript
        run: |
          node --check mobile-stluxe-final-v22.js
          node --check mobile-stluxe-about-v38.js
      - name: Verify changes
        run: |
          grep -q "assets/images/stluxe-about-logo.webp" mobile-stluxe-about-v38.js
          grep -q "margin:30px 0 0;padding:0 0 8px" mobile-stluxe-final-v22.js
          grep -q "20260831-v43-team-gutters" index.html
          grep -q "20260831-v43-about-photo" index.html
      - name: Commit v43
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/stluxe-about-logo.webp mobile-stluxe-final-v22.js mobile-stluxe-about-v38.js index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "Add STLuxe about photo and refine team gutters v43"
          git push
