name: Tighten STLuxe v11 booking and review authenticity
on:
  push:
    paths:
      - '.github/workflows/fix-v11-bookbar-reviews.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final behavior fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-clean-v11.js')
          s=p.read_text()
          old="const passedMain=overviewBottom<=window.innerHeight-80;"
          new="const passedMain=overviewBottom<=0;"
          if old not in s:
              raise SystemExit('Booking threshold code not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check mobile-stluxe-clean-v11.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-stluxe-clean-v11.js
          git commit -m 'Show v11 booking bar strictly after overview'
          git push
