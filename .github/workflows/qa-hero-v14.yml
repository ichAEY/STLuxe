name: QA hero v14
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture hero
        run: |
          mkdir -p qa-hero-v14
          cat > hero.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.goto('https://ichaey.github.io/STLuxe/?qa=hero-v14',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('.tn14-card',{timeout:20000});
          await page.waitForTimeout(800);
          await page.screenshot({path:'qa-hero-v14/hero.png',fullPage:false});
          const box=await page.locator('#tn13Top').boundingBox();
          console.log('hero box',box);
          await browser.close();
          JS
          node hero.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stluxe-hero-v14-qa
          path: qa-hero-v14
          retention-days: 1
