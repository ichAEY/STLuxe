name: Enable TANEM services v21
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect services v21
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script defer src="mobile-stluxe-services-v17.js?v=20260829-services-dark2"></script>'
          new='<script defer src="mobile-stluxe-services-v21.js?v=20260829-services-v21"></script>'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('services v17 marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check mobile-stluxe-services-v21.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable TANEM services v21"
          git push
