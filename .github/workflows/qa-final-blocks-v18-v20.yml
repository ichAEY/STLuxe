name: QA final TANEM blocks v18-v20
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture final blocks
        run: |
          mkdir -p qa-final-blocks
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.goto('https://ichaey.github.io/STLuxe/?qa=final-blocks-v18-v20',{waitUntil:'networkidle',timeout:120000});
          for (const [id,file] of [['#tn13Team','team.png'],['#tn13Reviews','reviews.png'],['#tn13Visit','visit.png']]) {
            await page.waitForSelector(id,{timeout:20000});
            await page.locator(id).screenshot({path:`qa-final-blocks/${file}`});
            console.log(id,await page.locator(id).boundingBox());
          }
          await browser.close();
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stluxe-final-blocks-v18-v20-qa
          path: qa-final-blocks
          retention-days: 1
