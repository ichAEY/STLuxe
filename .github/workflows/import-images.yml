name: Import STLuxe images

on:
  push:
    paths:
      - '.github/workflows/import-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download and optimize real STLuxe photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          from io import BytesIO

          photos = {
              'salon-reception.webp': 'https://avatars.mds.yandex.net/get-altay/2356223/2a000001749fb6af26fba368009a57356976/XXL_height',
              'salon-nail-zone.webp': 'https://avatars.mds.yandex.net/get-altay/2838749/2a000001749fb71ce2382d81a490e3a451bf/XXL_height',
              'nails-pink.webp': 'https://avatars.mds.yandex.net/get-altay/13940652/2a000001959efa0a48b57435914ce35b1f45/XXL_height',
              'nails-green.webp': 'https://avatars.mds.yandex.net/get-altay/15285359/2a000001959efa0a262deab78df6ae7407f0/XXL_height',
              'nails-light.webp': 'https://avatars.mds.yandex.net/get-altay/16161139/2a000001976a79dea275e72c24c723ea8d70/XXL_height',
              'hair-style.webp': 'https://avatars.mds.yandex.net/get-altay/13419691/2a000001926bc4ce64058c71fd84274195f7/XXL_height',
          }

          out = Path('assets/images')
          out.mkdir(parents=True, exist_ok=True)
          headers = {'User-Agent': 'Mozilla/5.0'}

          for filename, url in photos.items():
              print('Downloading', filename)
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as response:
                  data = response.read()
              image = Image.open(BytesIO(data)).convert('RGB')
              image.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
              image.save(out / filename, 'WEBP', quality=82, method=6)
              print(filename, (out / filename).stat().st_size, 'bytes')
          PY

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import and optimize STLuxe photos"
            git push
          fi
