name: Polish STLuxe mobile v22
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-final-v22.js')
          s=p.read_text()
          replacements=[
            ("grid-template-columns:minmax(0,1fr) 106px","grid-template-columns:minmax(0,1fr) 104px"),
            (".tn22-book-mini{height:31px;margin-top:9px;padding:0 12px;border:1px solid rgba(238,214,185,.35);border-radius:8px;background:#171411;color:#fff;font:500 10px/1 'Manrope',Arial,sans-serif}",".tn22-book-mini{width:104px;height:31px;margin-top:9px;padding:0 4px;border:1px solid rgba(238,214,185,.35);border-radius:8px;background:#171411;color:#fff!important;font:500 9.5px/1 'Manrope',Arial,sans-serif;white-space:nowrap}"),
            (".tn22-footer strong{font:500 23px/1 'Cormorant Garamond',Georgia,serif}",".tn22-footer strong{font:500 23px/1 'Cormorant Garamond',Georgia,serif;color:#fff!important}"),
            ("#tn13Sticky strong{display:block;margin-top:3px;font:600 15px/1 'Manrope',Arial,sans-serif!important;color:#191613!important;white-space:nowrap}","#tn13Sticky strong{display:block;margin-top:0;font:600 14px/1 'Manrope',Arial,sans-serif!important;color:#191613!important;white-space:nowrap}")
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit(f'marker missing: {old[:80]}')
              s=s.replace(old,new,1)
          css_marker=".tn22-menu i:nth-child(2){width:17px}"
          css_add=""".tn22-menu i:nth-child(2){width:17px}.tn22-navpop{position:absolute;z-index:60;top:46px;right:12px;width:190px;padding:7px 12px;border:1px solid rgba(70,55,48,.12);border-radius:15px;background:rgba(250,247,242,.98);box-shadow:0 16px 40px rgba(45,34,29,.16);display:none}.tn22-navpop.open{display:grid}.tn22-navpop a{min-height:40px;display:flex;align-items:center;border-bottom:1px solid rgba(70,55,48,.08);font:500 14px/1 'Cormorant Garamond',Georgia,serif;color:#211d1a;text-decoration:none}.tn22-navpop a:last-child{border-bottom:0}"""
          if '.tn22-navpop{' not in s:
              if css_marker not in s: raise SystemExit('menu css marker missing')
              s=s.replace(css_marker,css_add,1)
          old_sticky="sticky.innerHTML=`<span>Доступно<strong>${SERVICES.length} услуг</strong></span><button type=\"button\">Записаться</button>`;"
          new_sticky="sticky.innerHTML=`<strong>Доступно ${SERVICES.length} услуг</strong><button type=\"button\">Записаться</button>`;"
          if old_sticky not in s: raise SystemExit('sticky markup marker missing')
          s=s.replace(old_sticky,new_sticky,1)
          js_marker="hero.querySelector('.tn22-cta').addEventListener('click',book);"
          js_add="""hero.querySelector('.tn22-cta').addEventListener('click',book);
const menuButton=hero.querySelector('.tn22-menu');
const navPop=document.createElement('nav');navPop.className='tn22-navpop';navPop.innerHTML='<a href=\"#tn13Portfolio\">Портфолио</a><a href=\"#tn13Services\">Услуги и цены</a><a href=\"#tn13Team\">Команда</a><a href=\"#tn13Reviews\">Отзывы</a><a href=\"#tn13Visit\">Контакты</a>';hero.querySelector('.tn22-top').appendChild(navPop);menuButton.addEventListener('click',e=>{e.stopPropagation();navPop.classList.toggle('open')});navPop.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>navPop.classList.remove('open')));document.addEventListener('pointerdown',e=>{if(!e.target.closest('.tn22-top'))navPop.classList.remove('open')});"""
          if 'const menuButton=hero.querySelector' not in s:
              if js_marker not in s: raise SystemExit('hero js marker missing')
              s=s.replace(js_marker,js_add,1)
          p.write_text(s)
          i=Path('index.html');h=i.read_text();old='mobile-stluxe-final-v22.js?v=20260829-v22b';new='mobile-stluxe-final-v22.js?v=20260829-v22c'
          if new not in h:
              if old not in h: raise SystemExit('v22b cache marker missing')
              i.write_text(h.replace(old,new,1))
          PY
          node --check mobile-stluxe-final-v22.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Polish final STLuxe mobile v22"
          git push
