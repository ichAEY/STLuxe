name: Bump services v21 cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='mobile-stluxe-services-v21.js?v=20260829-services-v21'
          new='mobile-stluxe-services-v21.js?v=20260829-services-v21c'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('services v21 cache marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump refined services v21 cache"
          git push
