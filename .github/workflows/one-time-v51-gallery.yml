name: One-time STLuxe v51 gallery

on:
  push:
    paths:
      - '.github/workflows/one-time-v51-gallery.yml'

permissions:
  contents: write

jobs:
  switch-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect v51 gallery styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script defer src="mobile-stluxe-theme-v50.js?v=20260831-v50-unified-dark-live-status"></script>'
          addition=marker+'\n<script defer src="mobile-stluxe-theme-v51.js?v=20260831-v51-dark-gallery"></script>'
          if 'mobile-stluxe-theme-v51.js' in s:
              raise SystemExit('v51 already connected')
          if marker not in s:
              raise SystemExit('v50 marker not found')
          p.write_text(s.replace(marker,addition,1))
          PY
      - name: Validate
        run: |
          node --check mobile-stluxe-theme-v51.js
          grep -q 'mobile-stluxe-theme-v51.js?v=20260831-v51-dark-gallery' index.html
      - name: Commit switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply STLuxe v51 gallery styling"
          git push
