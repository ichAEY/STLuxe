name: One-time STLuxe v42

on:
  push:
    paths:
      - '.github/workflows/one-time-v42.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply STLuxe v42 patch
        run: python .github/scripts/patch-stluxe-v42.py
      - name: Validate JavaScript
        run: |
          node --check mobile-stluxe-final-v22.js
          node --check mobile-stluxe-about-v38.js
      - name: Verify required v42 changes
        run: |
          grep -q "Мастер 1" mobile-stluxe-final-v22.js
          grep -q "Пока нет фото" mobile-stluxe-final-v22.js
          grep -q "из \${String(viewerItems.length)" mobile-stluxe-final-v22.js
          grep -q "tn42-viewer-canvas" mobile-stluxe-final-v22.js
          grep -q "20260831-v42-structure-gallery" index.html
          grep -q "20260831-v42-about-card" index.html
      - name: Commit v42
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "Refine STLuxe mobile structure and gallery v42"
          git push
