name: One-time STLuxe v47 theme reviews

on:
  push:
    paths:
      - '.github/workflows/one-time-v47-theme-reviews.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reviews and switch theme
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('mobile-stluxe-final-v22.js')
          s = js.read_text()
          start = s.index('const REAL_REVIEW_DATA=[')
          end = s.index('];\nconst reviewInitial', start) + 2
          block = s[start:end]
          row = re.compile(r"\['((?:\\.|[^'\\])*)','((?:\\.|[^'\\])*)','((?:\\.|[^'\\])*)'\]")
          block2, count = row.subn(lambda m: "['" + m.group(1) + "','" + m.group(3) + "']", block)
          if count < 6:
              raise SystemExit(f'Expected review rows with dates, converted only {count}')
          s = s[:start] + block2 + s[end:]

          old_href = 'const reviewHref=r=>`${YANDEX_REVIEWS}#:~:text=${encodeURIComponent(r[2])}`;'
          new_href = 'const reviewHref=r=>`${YANDEX_REVIEWS}#:~:text=${encodeURIComponent(r[1])}`;'
          if old_href not in s:
              raise SystemExit('reviewHref marker not found')
          s = s.replace(old_href, new_href, 1)

          old_card = 'const reviewCard=r=>`<a class="tn30-review-card" href="${reviewHref(r)}" target="_blank" rel="noopener"><div class="tn30-review-head"><span class="tn30-review-avatar">${reviewInitial(r[0])}</span><span><strong class="tn30-review-name">${r[0]}</strong><span class="tn30-review-meta">${r[1]} · Яндекс Карты</span></span></div><p>${r[2]}</p><span class="tn30-review-open">Подробнее →</span></a>`;'
          new_card = 'const reviewCard=r=>`<a class="tn30-review-card" href="${reviewHref(r)}" target="_blank" rel="noopener"><div class="tn30-review-head"><span class="tn30-review-avatar">${reviewInitial(r[0])}</span><span><strong class="tn30-review-name">${r[0]}</strong><span class="tn30-review-meta">Яндекс Карты</span></span></div><p>${r[1]}</p><span class="tn30-review-open">Подробнее →</span></a>`;'
          if old_card not in s:
              raise SystemExit('reviewCard marker not found')
          s = s.replace(old_card, new_card, 1)
          js.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h, n1 = re.subn(r'mobile-stluxe-final-v22\.js\?v=[^"\']+', 'mobile-stluxe-final-v22.js?v=20260831-v47-review-no-dates', h, count=1)
          h, n2 = re.subn(r'mobile-stluxe-theme-v46\.js\?v=[^"\']+', 'mobile-stluxe-theme-v47.js?v=20260831-v47-white-gray-violet', h, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'index markers failed: final={n1}, theme={n2}')
          idx.write_text(h)
          PY
      - name: Validate
        run: |
          node --check mobile-stluxe-final-v22.js
          node --check mobile-stluxe-theme-v47.js
          grep -q 'tn30-review-meta">Яндекс Карты' mobile-stluxe-final-v22.js
          ! grep -q ' · Яндекс Карты' mobile-stluxe-final-v22.js
          grep -q 'mobile-stluxe-theme-v47.js?v=20260831-v47-white-gray-violet' index.html
          grep -q 'mobile-stluxe-final-v22.js?v=20260831-v47-review-no-dates' index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git commit -m "Refine STLuxe v47 background and remove review dates"
          git push
