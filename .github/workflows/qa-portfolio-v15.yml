name: QA portfolio v15
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture portfolio
        run: |
          mkdir -p qa-portfolio-v15
          cat > portfolio.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.goto('https://ichaey.github.io/STLuxe/?qa=portfolio-v15',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#tn13Portfolio .tn15-grid',{timeout:20000});
          await page.locator('#tn13Portfolio').screenshot({path:'qa-portfolio-v15/portfolio.png'});
          const box=await page.locator('#tn13Portfolio').boundingBox();
          console.log('portfolio box',box);
          await browser.close();
          JS
          node portfolio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stluxe-portfolio-v15-qa
          path: qa-portfolio-v15
          retention-days: 1
