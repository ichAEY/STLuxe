name: Scrape STLuxe gallery fast

on:
  push:
    paths:
      - '.github/workflows/scrape-stluxe-gallery-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - name: Fetch first gallery images
        run: |
          python - <<'PY'
          import re, requests
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          H={'User-Agent':'Mozilla/5.0'}
          s=requests.Session();s.headers.update(H)
          html=s.get('https://yandex.com/maps/org/beauty_salon_stluxe/51087098664/gallery/',timeout=15).text
          raw=re.findall(r'https:\\?/\\?/avatars\.mds\.yandex\.net\\?/get-altay\\?/[^"\\ ]+',html)
          urls=[]
          for u in raw:
            u=u.replace('\\/','/')
            u=re.split(r'/(?:orig|S|M|L|XL|XXL[^/]*)$',u)[0]
            if u not in urls: urls.append(u)
          print('urls',len(urls))
          out=Path('assets/images/candidates-fast');out.mkdir(parents=True,exist_ok=True)
          saved=0
          for i,u in enumerate(urls[:18],1):
            try:
              r=s.get(u+'/XXL_height',timeout=7);r.raise_for_status()
              im=Image.open(BytesIO(r.content)).convert('RGB')
              if im.width<500 or im.height<350: continue
              im.thumbnail((1400,1400),Image.Resampling.LANCZOS)
              im.save(out/f'candidate-{i:02d}.webp','WEBP',quality=80,method=4)
              saved+=1
            except Exception as e: print('skip',i,e)
          print('saved',saved)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/candidates-fast
          git commit -m "Import fast STLuxe gallery candidates" || exit 0
          git push
