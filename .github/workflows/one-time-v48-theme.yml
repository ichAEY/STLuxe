name: One-time STLuxe v48 theme

on:
  push:
    paths:
      - '.github/workflows/one-time-v48-theme.yml'

permissions:
  contents: write

jobs:
  switch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add v48 override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script defer src="mobile-stluxe-theme-v47.js?v=20260831-v47-white-gray-violet"></script>'
          addition=marker+'\n<script defer src="mobile-stluxe-theme-v48.js?v=20260831-v48-dark-gray-sections"></script>'
          if 'mobile-stluxe-theme-v48.js' in s:
              raise SystemExit('v48 already connected')
          if marker not in s:
              raise SystemExit('v47 marker not found')
          p.write_text(s.replace(marker,addition,1))
          PY
      - name: Validate
        run: |
          node --check mobile-stluxe-theme-v48.js
          grep -q 'mobile-stluxe-theme-v48.js?v=20260831-v48-dark-gray-sections' index.html
      - name: Commit switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply STLuxe v48 darker section backgrounds"
          git push
