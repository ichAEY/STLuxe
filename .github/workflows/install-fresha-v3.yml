name: Install Safari-safe Fresha v3
on:
  push:
    paths:
      - 'mobile-fresha-v3.js'
      - '.github/workflows/install-fresha-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old mobile script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="mobile-luxe-v2.js"></script>','<script defer src="mobile-fresha-v3.js?v=20260828-1435"></script>')
          if 'mobile-fresha-v3.js' not in s:
              s=s.replace('</body>','<script defer src="mobile-fresha-v3.js?v=20260828-1435"></script>\n</body>')
          p.write_text(s)
          PY
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Switch mobile STLuxe to Safari-safe Fresha v3"
          git push