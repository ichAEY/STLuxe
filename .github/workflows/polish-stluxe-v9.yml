name: Polish STLuxe Fresha v9

on:
  push:
    paths:
      - '.github/workflows/polish-stluxe-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final mobile details
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-fresha-v9.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'<div class=\"sx-nav-sticky\">'+navHTML('').replace", "'<div class=\"sx-nav sx-nav-sticky\">'+navHTML('').replace")
          s=s.replace('.sx-full{position:fixed;inset:0;z-index:120', '.sx-full{position:fixed;inset:0;z-index:140')
          s=s.replace('var heroIndex=0,startX=0,track=', 'var heroIndex=0,startX=0,swiped=false,track=')
          s=s.replace("function(e){startX=e.changedTouches[0].clientX}", "function(e){startX=e.changedTouches[0].clientX;swiped=false}")
          s=s.replace("if(Math.abs(d)>45)heroGo(heroIndex+(d<0?1:-1));", "if(Math.abs(d)>45){swiped=true;heroGo(heroIndex+(d<0?1:-1));}")
          s=s.replace("root.querySelector('#sxHeroGallery').onclick=function(){openGallery('venue')};", "root.querySelector('#sxHeroGallery').onclick=function(){if(swiped){swiped=false;return;}openGallery('venue')};")
          s=s.replace("root.querySelectorAll('.sx-nav').forEach(function(n){n.addEventListener('click',navHandler)});root.querySelector('.sx-nav-sticky').addEventListener('click',navHandler);", "root.querySelectorAll('.sx-nav').forEach(function(n){n.addEventListener('click',navHandler)});")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-fresha-v9.js
          git commit -m "Polish STLuxe Fresha mobile v9" || exit 0
          git push
