name: One-time STLuxe v32

on:
  push:
    paths:
      - '.github/workflows/one-time-v32.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused v32 patch
        run: python .github/scripts/patch-stluxe-v32.py
      - name: Validate JS
        run: node --check mobile-stluxe-final-v22.js
      - name: Commit focused changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "Refine STLuxe service pills and review cards v32"
          git push
