name: Switch hero v14
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add hero v14 script
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='<script defer src=\"mobile-stluxe-tanem-v13.js?v=20260829-0418\"></script>'; new=old+'\\n<script defer src=\"mobile-stluxe-hero-v14.js?v=20260829-hero2\"></script>'; assert old in s and 'mobile-stluxe-hero-v14.js' not in s; p.write_text(s.replace(old,new,1))"
      - name: Commit switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable pixel matched first block v14"
          git push
