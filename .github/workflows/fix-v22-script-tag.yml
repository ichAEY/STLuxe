name: Fix STLuxe v22 script tag
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one v22 script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          a='<script defer src="mobile-stluxe-final-v22.js?v=20260829-v22a"></script>'
          b='<script defer src="mobile-stluxe-final-v22.js?v=20260829-v22b"></script>'
          s=s.replace(a+'\n','').replace(a,'')
          while s.count(b)>1:
              s=s.replace(b+'\n','',1)
          if b not in s:
              marker='<script defer src="mobile-stluxe-tanem-v13.js?v=20260829-0418"></script>'
              if marker not in s: raise SystemExit('base marker missing')
              s=s.replace(marker,marker+'\n'+b,1)
          p.write_text(s)
          PY
          node --check mobile-stluxe-final-v22.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep a single STLuxe mobile v22 script"
          git push
