name: Install STLuxe Fresha mobile v9

on:
  push:
    paths:
      - '.github/workflows/install-stluxe-fresha-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace active mobile layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script[^>]+src="(?:mobile-[^"]+\.js[^\"]*)"[^>]*></script>','',s,flags=re.I)
          tag='\n<script defer src="mobile-stluxe-fresha-v9.js?v=20260829-0245"></script>\n'
          if '</body>' in s:
              s=s.replace('</body>',tag+'</body>')
          else:
              s+=tag
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable STLuxe Fresha mobile v9" || exit 0
          git push
