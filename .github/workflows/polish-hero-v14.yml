name: Polish hero v14
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply measured polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-hero-v14.js')
          s=p.read_text()
          reps={
            'font:500 24px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.15em':'font:500 22px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.13em',
            'object-fit:cover;object-position:center 50%}':'object-fit:cover;object-position:center 50%;filter:grayscale(.55) sepia(.14) saturate(.75) brightness(.72) contrast(1.08)}',
            'background:linear-gradient(180deg,rgba(18,13,10,.02),rgba(18,13,10,.07))':'background:linear-gradient(180deg,rgba(18,13,10,.03),rgba(32,22,16,.12))',
            'font:500 45px/.92 "Cormorant Garamond",Georgia,serif;letter-spacing:.135em;text-indent:.135em':'font:500 47px/.90 "Cormorant Garamond",Georgia,serif;letter-spacing:.155em;text-indent:.155em',
            'margin-top:13px;font-size:10.5px':'margin-top:12px;font-size:10.5px',
            'color:#c1ad98;height:10px':'color:#bda388;height:10px',
            'background:#d3c4b5':'background:#c9b49e',
            'width:242px;max-width:100%;height:49px;margin:20px auto 0':'width:246px;max-width:100%;height:49px;margin:18px auto 0'
          }
          for a,b in reps.items():
            if a in s: s=s.replace(a,b,1)
          p.write_text(s)

          q=Path('index.html')
          x=q.read_text()
          x=x.replace('mobile-stluxe-hero-v14.js?v=20260829-hero2','mobile-stluxe-hero-v14.js?v=20260829-hero3')
          q.write_text(x)
          PY
          node --check mobile-stluxe-hero-v14.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-hero-v14.js index.html
          git commit -m "Polish first block to reference"
          git push
