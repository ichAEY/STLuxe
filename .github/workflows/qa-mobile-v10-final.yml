name: QA STLuxe mobile v10 final

on:
  push:
    paths:
      - '.github/workflows/qa-mobile-v10-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture exact mobile states
        run: |
          mkdir -p qa
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.goto('https://ichaey.github.io/STLuxe/?qa=v10-final3',{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(2200);
          const app=page.locator('#stluxe-clean-v10');
          await page.screenshot({path:'qa/mobile-full.png',fullPage:true});
          await app.locator('.fx-hero-slide').first().click();
          await page.waitForTimeout(350);
          await page.screenshot({path:'qa/gallery.png',fullPage:false});
          await app.locator('#fxGalleryClose').click();
          await app.locator('.fx-section#team').scrollIntoViewIfNeeded();
          await app.locator('[data-master="tatiana"]').click();
          await page.waitForTimeout(350);
          await page.screenshot({path:'qa/master-tatiana.png',fullPage:false});
          await browser.close();
          JS
          node shot.mjs
      - name: Commit QA screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/mobile-full.png qa/gallery.png qa/master-tatiana.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture final STLuxe clean v10 QA screenshots"
          git push
