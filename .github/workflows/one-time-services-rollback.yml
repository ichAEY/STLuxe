name: One-time STLuxe services rollback

on:
  push:
    paths:
      - '.github/workflows/one-time-services-rollback.yml'

permissions:
  contents: write

jobs:
  rollback-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore older mobile services block only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          target = Path('mobile-stluxe-final-v22.js')
          current = target.read_text()
          old = subprocess.check_output([
              'git','show','35644a9482f0b843dc80e856b16e0c91fe5b84cd:mobile-stluxe-final-v22.js'
          ], text=True)

          css_re = r"#tn13Services\{.*?(?=\n\n#tn13Team\{)"
          old_css = re.search(css_re, old, re.S)
          cur_css = re.search(css_re, current, re.S)
          if not old_css or not cur_css:
              raise SystemExit('Services CSS block not found')
          current = current[:cur_css.start()] + old_css.group(0) + current[cur_css.end():]

          js_re = r"// SERVICES\n.*?(?=// TEAM \+ TEAM SHEET)"
          old_js = re.search(js_re, old, re.S)
          cur_js = re.search(js_re, current, re.S)
          if not old_js or not cur_js:
              raise SystemExit('Services JS block not found')
          current = current[:cur_js.start()] + old_js.group(0) + current[cur_js.end():]
          target.write_text(current)

          index = Path('index.html')
          html = index.read_text()
          old_ver = 'mobile-stluxe-final-v22.js?v=20260830-v28-ticker'
          new_ver = 'mobile-stluxe-final-v22.js?v=20260830-v29-services-old'
          if old_ver not in html:
              raise SystemExit('Expected cache key not found')
          index.write_text(html.replace(old_ver, new_ver, 1))
          PY
      - name: Commit services rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "Restore older STLuxe mobile services block"
          git push
