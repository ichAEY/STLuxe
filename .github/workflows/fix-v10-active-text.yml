name: Fix STLuxe v10 active text

on:
  push:
    paths:
      - '.github/workflows/fix-v10-active-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix black controls text contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-clean-v10.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.fx-gallery-tabs button.active{background:#111;color:#fff;border-color:#111}', '.fx-gallery-tabs button.active{background:#111!important;color:#fff!important;border-color:#111!important}')
          s=s.replace('.fx-profile-tabs button.active{background:#111;color:#fff;border-color:#111}', '.fx-profile-tabs button.active{background:#111!important;color:#fff!important;border-color:#111!important}')
          s=s.replace('.fx-visit-actions a:last-child{background:#111;color:#fff;border-color:#111}', '.fx-visit-actions a:last-child{background:#111!important;color:#fff!important;border-color:#111!important}')
          p.write_text(s,encoding='utf-8')
          PY
          node --check mobile-stluxe-clean-v10.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-clean-v10.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix STLuxe v10 black control text contrast"
          git push
