name: Fix STLuxe v23 lashes gallery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix empty gallery category lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-stluxe-final-v22.js')
          s=p.read_text()
          old="function openGallery(cat='Салон'){galleryCat=GALLERY[cat]?cat:'Салон';"
          new="function openGallery(cat='Салон'){galleryCat=Object.prototype.hasOwnProperty.call(GALLERY,cat)?cat:'Салон';"
          if old not in s: raise SystemExit('gallery marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check mobile-stluxe-final-v22.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-stluxe-final-v22.js
          git commit -m "Fix lashes category in STLuxe gallery"
          git push
