name: Enable consolidated STLuxe mobile v22
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v22
        run: node --check mobile-stluxe-final-v22.js
      - name: Connect consolidated mobile layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_tags=[
            '<script defer src="mobile-stluxe-hero-v14.js?v=20260829-hero4"></script>',
            '<script defer src="mobile-stluxe-portfolio-v15.js?v=20260829-portfolio2"></script>',
            '<script defer src="mobile-stluxe-services-v21.js?v=20260829-services-v21c"></script>',
            '<script defer src="mobile-stluxe-team-v18.js?v=20260829-team2"></script>',
            '<script defer src="mobile-stluxe-reviews-v19.js?v=20260829-reviews2"></script>',
            '<script defer src="mobile-stluxe-visit-v20.js?v=20260829-visit2"></script>'
          ]
          for tag in old_tags:
              s=s.replace(tag+'\n','').replace(tag,'')
          new='<script defer src="mobile-stluxe-final-v22.js?v=20260829-v22a"></script>'
          if new not in s:
              marker='<script defer src="mobile-stluxe-tanem-v13.js?v=20260829-0418"></script>'
              if marker not in s:
                  raise SystemExit('v13 marker missing')
              s=s.replace(marker,marker+'\n'+new,1)
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable consolidated STLuxe mobile v22"
          git push
