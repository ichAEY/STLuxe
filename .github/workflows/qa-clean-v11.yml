name: QA STLuxe clean mobile v11
on:
  push:
    paths:
      - '.github/workflows/qa-clean-v11.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture and assert mobile states
        run: |
          mkdir -p qa-v11
          cat > qa-v11/shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.goto('https://ichaey.github.io/STLuxe/?qa=v11-final',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#stluxe-clean-v11',{timeout:20000});
          await page.waitForTimeout(1600);
          const count=await page.locator('#v11Bookbar .v11-book-count').innerText();
          if(!count.includes('17 услуг')) throw new Error('Wrong service count: '+count);
          await page.screenshot({path:'qa-v11/top.png',fullPage:false});
          await page.screenshot({path:'qa-v11/full.png',fullPage:true});
          await page.locator('#services').scrollIntoViewIfNeeded(); await page.waitForTimeout(450);
          const reserve=page.locator('.v11-service-book').first();
          const reserveColor=await reserve.evaluate(el=>getComputedStyle(el).color);
          if(!reserveColor.includes('255')) throw new Error('Service booking text is not white: '+reserveColor);
          await page.screenshot({path:'qa-v11/services.png',fullPage:false});
          await page.locator('#team').scrollIntoViewIfNeeded(); await page.waitForTimeout(550);
          const activeTeam=page.locator('.v11-nav-sticky button.active');
          if((await activeTeam.innerText())!=='Команда') throw new Error('Sticky nav did not activate Team');
          const box=await activeTeam.boundingBox();
          if(!box || box.x<0 || box.x+box.width>390) throw new Error('Active Team nav item is outside viewport');
          await page.screenshot({path:'qa-v11/team.png',fullPage:false});
          await page.locator('[data-master="tatiana"]').click(); await page.waitForTimeout(350);
          await page.screenshot({path:'qa-v11/master.png',fullPage:false});
          await page.locator('#v11MasterClose').click();
          await page.locator('#reviews').scrollIntoViewIfNeeded(); await page.waitForTimeout(550);
          if((await page.locator('.v11-nav-sticky button.active').innerText())!=='Отзывы') throw new Error('Sticky nav did not activate Reviews');
          await page.screenshot({path:'qa-v11/reviews.png',fullPage:false});
          await page.locator('#gallery').scrollIntoViewIfNeeded(); await page.waitForTimeout(350);
          await page.locator('.v11-open-gallery').click(); await page.waitForTimeout(300);
          await page.screenshot({path:'qa-v11/gallery.png',fullPage:false});
          await browser.close();
          JS
          node qa-v11/shot.mjs
      - name: Commit QA screenshots
        run: |
          rm -f qa-v11/shot.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-v11
          git commit -m 'Capture STLuxe v11 mobile QA'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: stluxe-v11-qa
          path: qa-v11/*.png
          retention-days: 1
